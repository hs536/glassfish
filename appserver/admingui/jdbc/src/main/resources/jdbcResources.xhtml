<!--
    Prototype only (docs/試作計画.md P-3): the JDBC resources list as a Facelets page. It takes precedence over
    jdbcResources.jsf and renders only the page content; the page frame comes from facesShell.jsf or from the page
    that loads it with Ajax.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html">
    <div id="facesPage" class="guiPageContent">
        <h1 id="pageTitle">JDBC Resources</h1>
        <p>JDBC resources provide applications with a means to connect to a database.</p>
        <h:dataTable id="resources" value="#{jdbcResourcesView.names}" var="name">
            <h:column>
                <f:facet name="header" xmlns:f="jakarta.faces.core">JNDI Name</f:facet>
                #{name}
            </h:column>
        </h:dataTable>
    </div>
    <script>document.title = 'JDBC Resources';</script>
</ui:composition>

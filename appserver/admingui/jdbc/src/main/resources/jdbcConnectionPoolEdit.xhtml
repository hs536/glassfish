<!--
    Prototype (adr/0006, adr/0008): the General tab of a JDBC connection pool as a Facelets page. It takes precedence
    over jdbcConnectionPoolEdit.jsf. The Advanced and Additional Properties tabs open the JSFTemplating pages. Choosing
    the resource type renders the classname rows again, where the JSFTemplating page enabled and disabled the fields
    with JavaScript.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njdbc" value="#{consoleBundles.get('jdbc', 'org.glassfish.jdbc.admingui.Strings')}"/>
    <c:set var="bean" value="#{jdbcConnectionPoolEditView}"/>

    <h:form id="propertyForm">
        <adm:tabSet id="jdbcPoolSet" rendered="#{bean.found}">
            <adm:tab label="#{i18n['common.General']}" selected="true"/>
            <adm:tab label="#{i18n['common.Advanced']}" url="#{bean.advancedPage}"/>
            <adm:tab label="#{i18n['common.AdditonalProperties']}" url="#{bean.propertiesPage}"/>
        </adm:tabSet>

        <adm:pageTitle id="propertyContentPage" title="#{i18njdbc['jdbcConnectionPool.editPageTitle']}"
                       helpText="#{i18njdbc['jdbcConnection.editPageHelp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="saveButton" value="#{i18n['button.Save']}" styleClass="Btn1_sun4" rendered="#{bean.found}" action="#{bean.save}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <input id="propertyForm:cancelButton" type="button" class="Btn2_sun4" value="#{i18n['button.Cancel']}"
                           onclick="admingui.ajax.loadPage({url: '#{request.contextPath}/jdbc/jdbcConnectionPools.jsf'}); return false;"/>
                </h:panelGroup>
            </f:facet>
            <h:panelGroup rendered="#{bean.found}">
                <h:commandButton id="loadDefaultsButton" value="#{i18n['button.LoadDefaults']}" styleClass="Btn2_sun4" style="margin-left: 8pt"
                                 action="#{bean.loadDefaults}">
                    <f:ajax execute="@form" render="@form"/>
                </h:commandButton>
                <h:commandButton id="flush" value="#{i18njdbc['button.Flush']}" styleClass="Btn2_sun4" action="#{bean.flush}">
                    <f:ajax execute="@this" render="@form"/>
                </h:commandButton>
                <h:commandButton id="ping" value="#{i18n['button.Ping']}" styleClass="Btn2_sun4" action="#{bean.ping}">
                    <f:ajax execute="@this" render="@form"/>
                </h:commandButton>
            </h:panelGroup>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <ui:fragment rendered="#{bean.found}">
            <adm:propertySheet id="sheet" legend="#{i18njdbc['jdbcPool.general']}">
                <adm:property id="name" label="#{i18njdbc['jdbcPool.poolName']}">
                    <h:outputText id="poolName" value="#{bean.name}"/>
                </adm:property>
                <adm:property id="resTypeEditProp" label="#{i18n['common.resType']}" for="resTypeVal" helpText="#{i18njdbc['jdbcPool.resTypeHelp']}">
                    <h:selectOneMenu id="resTypeVal" value="#{bean.values['resType']}" styleClass="MnuStd_sun4">
                        <f:selectItems value="#{bean.resourceTypes}"/>
                        <f:ajax execute="@this" render=":propertyForm:sheet:dSProp :propertyForm:sheet:dDSProp"/>
                    </h:selectOneMenu>
                </adm:property>
                <adm:property id="dSProp" label="#{i18njdbc['jdbcPool.datasource']}" for="dsTextField" helpText="#{i18njdbc['jdbcPool.datasourceHelp']}">
                    <h:inputText id="dsTextField" value="#{bean.values['datasourceClassname']}" size="60" maxlength="512" styleClass="TxtFld_sun4"
                                 disabled="#{bean.driver}"/>
                </adm:property>
                <adm:property id="dDSProp" label="#{i18njdbc['jdbcPool.driver']}" for="ddsTextField" helpText="#{i18njdbc['jdbcPool.driverHelp']}">
                    <h:inputText id="ddsTextField" value="#{bean.values['driverClassname']}" size="60" maxlength="512" styleClass="TxtFld_sun4"
                                 disabled="#{not bean.driver}"/>
                </adm:property>
                <adm:property id="pingProp" label="#{i18njdbc['jdbcPool.ping']}" for="pingValue" helpText="#{i18njdbc['jdbcPool.pingHelp']}">
                    <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="pingValue" value="#{bean.flags['ping']}"/></span>
                </adm:property>
                <adm:property id="deploymentOrderProp" label="#{i18n['common.resource.deploymentOrder']}" for="deploymentOrder"
                              helpText="#{i18n['common.resource.deploymentOrderHelp']}">
                    <h:inputText id="deploymentOrder" value="#{bean.values['deploymentOrder']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                </adm:property>
                <adm:property id="descProp" label="#{i18n['common.description']}" for="desc">
                    <h:inputText id="desc" value="#{bean.values['description']}" size="60" maxlength="512" styleClass="TxtFld_sun4"/>
                </adm:property>
            </adm:propertySheet>

            <adm:propertySheet id="poolSettingsPropertySheet" legend="#{i18njdbc['jdbcPool.poolSettings']}">
                <adm:property id="initSizeProp" label="#{i18njdbc['jdbcPool.initPoolSize']}" for="steadyPoolSize" helpText="#{i18njdbc['jdbcPool.initPoolSizeHelp']}">
                    <h:inputText id="steadyPoolSize" value="#{bean.values['steadyPoolSize']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                    <h:outputText value="#{i18n['common.Connections']}" style="padding: 8pt"/>
                </adm:property>
                <adm:property id="maxProp" label="#{i18njdbc['jdbcPool.maxPoolSize']}" for="maxPoolSize" helpText="#{i18njdbc['jdbcPool.maxPoolSizeHelp']}">
                    <h:inputText id="maxPoolSize" value="#{bean.values['maxPoolSize']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                    <h:outputText value="#{i18n['common.Connections']}" style="padding: 8pt"/>
                </adm:property>
                <adm:property id="resizeProp" label="#{i18njdbc['jdbcPool.poolResize']}" for="poolResizeQuantity" helpText="#{i18njdbc['jdbcPool.poolResizeHelp']}">
                    <h:inputText id="poolResizeQuantity" value="#{bean.values['poolResizeQuantity']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                    <h:outputText value="#{i18n['common.Connections']}" style="padding: 8pt"/>
                </adm:property>
                <adm:property id="idleProp" label="#{i18njdbc['jdbcPool.idleTimeout']}" for="idleTimeout" helpText="#{i18njdbc['jdbcPool.idleTimeoutHelp']}">
                    <h:inputText id="idleTimeout" value="#{bean.values['idleTimeoutInSeconds']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                    <h:outputText value="#{i18n['common.Seconds']}" style="padding: 8pt"/>
                </adm:property>
                <adm:property id="maxWaitProp" label="#{i18njdbc['jdbcPool.maxWait']}" for="maxWait" helpText="#{i18njdbc['jdbcPool.maxWaitHelp']}">
                    <h:inputText id="maxWait" value="#{bean.values['maxWaitTimeInMillis']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                    <h:outputText value="#{i18n['common.Milliseconds']}" style="padding: 8pt"/>
                </adm:property>
            </adm:propertySheet>

            <adm:propertySheet id="transactionPropertySheet" legend="#{i18njdbc['jdbcPool.transIsolationSection']}">
                <adm:property id="nonTransProp" label="#{i18njdbc['jdbcPool.nonTransConnection']}" for="nonTransactional"
                              helpText="#{i18njdbc['jdbcPool.nonTransConnectionHelp']}">
                    <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="nonTransactional" value="#{bean.flags['nonTransactionalConnections']}"/></span>
                </adm:property>
                <adm:property id="transProp" label="#{i18njdbc['jdbcPool.transIsolation']}" for="transIso" helpText="#{i18njdbc['jdbcPool.transIsolationHelp']}">
                    <h:selectOneMenu id="transIso" value="#{bean.values['transactionIsolationLevel']}" styleClass="MnuStd_sun4">
                        <f:selectItems value="#{bean.isolationLevels}"/>
                    </h:selectOneMenu>
                </adm:property>
                <adm:property id="levelProp" label="#{i18njdbc['jdbcPool.isoLevel']}" for="isolationGuaranteed" helpText="#{i18njdbc['jdbcPool.isoLevelHelp']}">
                    <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="isolationGuaranteed" value="#{bean.flags['isIsolationLevelGuaranteed']}"/></span>
                    <h:outputLabel for="isolationGuaranteed" value="#{i18njdbc['jdbcPool.Guaranteed']}"/>
                </adm:property>
            </adm:propertySheet>
        </ui:fragment>
            <input id="helpKey" type="hidden" value="#{consoleBundles.get('jdbc', 'org.glassfish.jdbc.admingui.Helplinks')['jdbcConnectionPoolEdit']}"/>
    </h:form>
    <script>document.title = '#{i18njdbc['jdbcConnectionPool.editPageTitle']}';</script>
</ui:composition>

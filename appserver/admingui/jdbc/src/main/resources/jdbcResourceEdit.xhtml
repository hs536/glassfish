<!--
    Prototype (docs/試作計画.md P-4, P-5): the edit JDBC resource page as a Facelets page. It takes precedence over
    jdbcResourceEdit.jsf. The Target tab opens the JSFTemplating page common/resourceNode/resourceEditTargets.jsf.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njdbc" value="#{consoleBundles.get('jdbc', 'org.glassfish.jdbc.admingui.Strings')}"/>
    <c:set var="view" value="#{jdbcResourceEditView}"/>

    <h:form id="propertyForm">
        <adm:tabSet id="resEditTabs" rendered="#{view.found and not view.onlyServer}">
            <adm:tab label="#{i18n['common.General']}" selected="true"/>
            <adm:tab label="#{i18n['common.TargetTab']}" url="#{view.targetPage}"/>
        </adm:tabSet>

        <adm:pageTitle id="propertyContentPage" title="#{i18njdbc['jdbcResource.editPageTitle']}"
                       helpText="#{i18njdbc['jdbcResource.editPageTitleHelp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="saveButton" value="#{i18n['button.Save']}" styleClass="Btn1_sun4"
                                     rendered="#{view.found}" action="#{view.save}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <input id="propertyForm:cancelButton" type="button" class="Btn2_sun4" value="#{i18n['button.Cancel']}"
                           onclick="admingui.ajax.loadPage({url: '#{request.contextPath}/jdbc/jdbcResources.jsf'}); return false;"/>
                </h:panelGroup>
            </f:facet>
            <h:commandButton id="loadDefaultsButton" value="#{i18n['button.LoadDefaults']}" styleClass="Btn2_sun4" style="margin-left: 8pt"
                             rendered="#{view.found}" action="#{view.loadDefaults}">
                <f:ajax execute="@form" render="@form"/>
            </h:commandButton>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <adm:propertySheet id="propertySheet" rendered="#{view.found}">
            <adm:property id="name" label="#{i18n['common.jndiName']}">
                <h:outputText id="name" value="#{view.name}"/>
            </adm:property>
            <adm:property id="logicalName" label="#{i18n['common.logicalJndiName']}" rendered="#{not empty view.logicalJndiName}">
                <h:outputText id="lName" value="#{view.logicalJndiName}"/>
            </adm:property>
            <adm:property id="poolNameProp" label="#{i18n['common.poolName']}" for="PoolName"
                          helpText="#{view.poolHelp}" helpTextEscape="false">
                <h:selectOneMenu id="PoolName" value="#{view.poolName}" styleClass="MnuStd_sun4">
                    <f:selectItems value="#{view.pools}"/>
                </h:selectOneMenu>
            </adm:property>
            <adm:property id="deploymentOrderProp" label="#{i18n['common.resource.deploymentOrder']}" for="deploymentOrder"
                          helpText="#{i18n['common.resource.deploymentOrderHelp']}">
                <h:inputText id="deploymentOrder" value="#{view.deploymentOrder}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
            </adm:property>
            <adm:property id="descProp" label="#{i18n['common.description']}" for="desc">
                <h:inputText id="desc" value="#{view.description}" size="55" maxlength="512" styleClass="TxtFld_sun4"/>
            </adm:property>
            <adm:property id="statusProp" label="#{i18n['common.status']}" for="enabled" rendered="#{view.onlyServer}">
                <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="enabled" value="#{view.enabled}"/></span>
            </adm:property>
            <adm:property id="statusProp2" label="#{i18n['common.status']}" rendered="#{not view.onlyServer}"
                          helpText="#{i18n['application.EnableTargetHelp']}">
                <h:outputText id="enabledStr" value="#{view.status}"/>
            </adm:property>
        </adm:propertySheet>

        <adm:propertyTable id="basicTable" rows="#{view.properties}" title="#{i18n['common.AdditionalProperties']}" rendered="#{view.found}"/>
    </h:form>
    <script>document.title = '#{i18njdbc['jdbcResource.editPageTitle']}';</script>
</ui:composition>

<!--
    Prototype (docs/試作計画.md P-5): one labelled field of an adm:propertySheet, rendered as a table row. The child
    is the input; "for" is its id. The style classes are those of the console theme.
-->
<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:ui="jakarta.faces.facelets"
              xmlns:h="jakarta.faces.html"
              xmlns:cc="jakarta.faces.composite">
    <cc:interface>
        <cc:attribute name="label" required="true"/>
        <cc:attribute name="for"/>
        <cc:attribute name="required" default="false"/>
        <cc:attribute name="helpText"/>
        <cc:attribute name="helpTextEscape" default="true"/>
    </cc:interface>
    <cc:implementation>
        <tr id="#{cc.clientId}">
            <td valign="top" nowrap="nowrap" align="left">
                <div class="ConTblCl1Div_sun4">
                    <h:outputLabel for="#{cc.attrs.for}" styleClass="LblLev2Txt_sun4">
                        #{cc.attrs.label}
                        <h:graphicImage rendered="#{cc.attrs.required}" value="/theme/com/sun/webui/jsf/suntheme/images/other/required.gif"
                                        alt="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')['common.requiredIndicator']}"
                                        height="14" width="7"/>
                    </h:outputLabel>
                </div>
            </td>
            <td>
                <div class="ConTblCl2Div_sun4">
                    <cc:insertChildren/>
                    <ui:fragment rendered="#{not empty cc.attrs.helpText}">
                        <div class="inlineFieldHelp_sun4">
                            <h:outputText value="#{cc.attrs.helpText}" escape="#{cc.attrs.helpTextEscape}"/>
                        </div>
                    </ui:fragment>
                </div>
            </td>
        </tr>
    </cc:implementation>
</ui:component>

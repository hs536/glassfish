<!--
    Prototype (docs/試作計画.md P-5): a section of labelled fields. The children are adm:property components,
    one table row each. The style classes are those of the console theme.
-->
<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:ui="jakarta.faces.facelets"
              xmlns:cc="jakarta.faces.composite">
    <cc:interface>
        <cc:attribute name="legend"/>
    </cc:interface>
    <cc:implementation>
        <div id="#{cc.clientId}" class="PrpSht_sun4">
            <div class="ConFldSet_sun4">
                <div class="ConFldSetDiv_sun4">
                    <ui:fragment rendered="#{not empty cc.attrs.legend}">
                        <div class="ConFldSetLgdDiv_sun4">#{cc.attrs.legend}</div>
                    </ui:fragment>
                    <table border="0" cellspacing="0" cellpadding="0" role="presentation">
                        <tbody>
                            <cc:insertChildren/>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </cc:implementation>
</ui:component>

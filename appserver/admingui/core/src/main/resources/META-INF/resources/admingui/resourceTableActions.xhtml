<!--
    Prototype (adr/0009 decision 3): the action bar of a resource list, for the actions facet of adm:table. The bean
    is an org.glassfish.admingui.common.util.ResourceListView. Give the component the id "actions", so that the row
    check boxes can render it again (render=":<form>:<table>:actions") when the selection changes.
-->
<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:ui="jakarta.faces.facelets"
              xmlns:h="jakarta.faces.html"
              xmlns:f="jakarta.faces.core"
              xmlns:c="jakarta.tags.core"
              xmlns:pt="jakarta.faces.passthrough"
              xmlns:cc="jakarta.faces.composite">
    <cc:interface>
        <cc:attribute name="bean" required="true"/>
        <!-- The new page, relative to the context root, for example /jdbc/jdbcResourceNew.jsf -->
        <cc:attribute name="newPage" required="true"/>
        <cc:attribute name="deleteConfirmation" required="true"/>
        <cc:attribute name="enableActions" default="true"/>
    </cc:interface>
    <cc:implementation>
        <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
        <c:set var="tableImages" value="#{request.contextPath}/theme/com/sun/webui/jsf/suntheme/images/table"/>
        <span id="#{cc.clientId}">
            <h:commandLink id="selectAll" title="#{i18n['table.selectAll']}" action="#{cc.attrs.bean.selectAll()}">
                <f:ajax execute="@form" render="@form"/>
                <img src="#{tableImages}/select_multiple.gif" alt="#{i18n['table.selectAll']}" height="20" width="23" border="0" align="top"/>
            </h:commandLink>
            <h:commandLink id="deselectAll" title="#{i18n['table.deselectAll']}" action="#{cc.attrs.bean.deselectAll()}">
                <f:ajax execute="@form" render="@form"/>
                <img src="#{tableImages}/deselect_multiple.gif" alt="#{i18n['table.deselectAll']}" height="20" width="23" border="0" align="top"/>
            </h:commandLink>
            <input id="#{cc.clientId}:newButton" type="button" class="Btn1_sun4" value="#{i18n['button.New']}"
                   onclick="admingui.ajax.loadPage({url: '#{request.contextPath}#{cc.attrs.newPage}'}); return false;"/>
            <h:commandButton id="deleteButton" value="#{i18n['button.Delete']}"
                             styleClass="#{cc.attrs.bean.anySelected ? 'Btn2_sun4' : 'Btn2Dis_sun4'}" disabled="#{not cc.attrs.bean.anySelected}"
                             pt:data-confirm="#{cc.attrs.deleteConfirmation}"
                             onclick="if (!confirm(this.dataset.confirm)) { return false; }" action="#{cc.attrs.bean.delete()}">
                <f:ajax execute="@form" render="@form"/>
            </h:commandButton>
            <h:commandButton id="enableButton" value="#{i18n['button.Enable']}" rendered="#{cc.attrs.enableActions}"
                             styleClass="#{cc.attrs.bean.anySelected ? 'Btn2_sun4' : 'Btn2Dis_sun4'}" disabled="#{not cc.attrs.bean.anySelected}"
                             action="#{cc.attrs.bean.enable()}">
                <f:ajax execute="@form" render="@form"/>
            </h:commandButton>
            <h:commandButton id="disableButton" value="#{i18n['button.Disable']}" rendered="#{cc.attrs.enableActions}"
                             styleClass="#{cc.attrs.bean.anySelected ? 'Btn2_sun4' : 'Btn2Dis_sun4'}" disabled="#{not cc.attrs.bean.anySelected}"
                             action="#{cc.attrs.bean.disable()}">
                <f:ajax execute="@form" render="@form"/>
            </h:commandButton>
        </span>
    </cc:implementation>
</ui:component>

<!--
    Prototype (docs/試作計画.md P-5): one tab of an adm:tabSet. The selected tab is the current page; the others
    link to their page.
-->
<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:ui="jakarta.faces.facelets"
              xmlns:cc="jakarta.faces.composite">
    <cc:interface>
        <cc:attribute name="label" required="true"/>
        <cc:attribute name="url"/>
        <cc:attribute name="selected" default="false"/>
    </cc:interface>
    <cc:implementation>
        <ui:fragment rendered="#{cc.attrs.selected}">
            <td class="Tab1TblSelTd_sun4">
                <div class="Tab1SelTxtNew_sun4" aria-current="page">#{cc.attrs.label}</div>
            </td>
        </ui:fragment>
        <ui:fragment rendered="#{not cc.attrs.selected}">
            <td>
                <a class="Tab1Lnk_sun4 TabPad_sun4" href="#{cc.attrs.url}">#{cc.attrs.label}</a>
            </td>
        </ui:fragment>
    </cc:implementation>
</ui:component>

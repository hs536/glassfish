<!--
    Prototype (docs/試作計画.md P-5): a row of page tabs. The children are adm:tab components. A tab opens another
    page; the console loads it into the content area like any other link.
-->
<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:ui="jakarta.faces.facelets"
              xmlns:cc="jakarta.faces.composite">
    <cc:interface/>
    <cc:implementation>
        <div id="#{cc.clientId}">
            <div class="Tab1Div_sun4">
                <table border="0" cellspacing="0" cellpadding="0" class="Tab1TblNew_sun4" role="presentation">
                    <tbody>
                        <tr>
                            <cc:insertChildren/>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </cc:implementation>
</ui:component>

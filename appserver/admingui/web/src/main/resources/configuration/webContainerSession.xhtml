<!--
    Prototype (adr/0006, adr/0008, adr/0009): the Session Properties tab of the web container as a Facelets page. It
    takes precedence over webContainerSession.jsf.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18nweb" value="#{consoleBundles.get('web', 'org.glassfish.web.admingui.Strings')}"/>
    <c:set var="bean" value="#{webContainerSessionView}"/>

    <h:form id="form1">
        <ui:include src="/web/configuration/webContainerTabs.xhtml">
            <ui:param name="bean" value="#{bean}"/>
            <ui:param name="selected" value="session"/>
        </ui:include>

        <adm:pageTitle id="propertyContentPage" title="#{i18nweb['webContainer.sessionProp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="saveButton" value="#{i18n['button.Save']}" styleClass="Btn1_sun4" action="#{bean.save}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                </h:panelGroup>
            </f:facet>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <adm:propertySheet id="configNameSheet">
            <adm:property id="configName" label="#{i18n['common.ConfigurationName']}">
                <h:outputText id="config" value="#{bean.configName}"/>
            </adm:property>
        </adm:propertySheet>

        <adm:propertySheet id="sessionPropSheetSection">
            <adm:property id="SessionTimeoutProp" label="#{i18nweb['webSession.sessionTimeoutLabel']}" for="SessionTimeout"
                          helpText="#{i18nweb['webSession.sessionTimeoutHelp']}">
                <h:inputText id="SessionTimeout" value="#{bean.values['timeoutInSeconds']}" size="20" maxlength="512"
                             styleClass="integer TxtFld_sun4"/>
                <h:outputText id="sec" value="#{i18n['common.Seconds']}" style="padding: 8pt"/>
            </adm:property>
        </adm:propertySheet>

        <adm:propertyTable id="basicTable" rows="#{bean.properties}" title="#{i18n['common.AdditionalProperties']}"/>
    </h:form>
    <script>document.title = '#{i18nweb['webContainer.sessionProp']}';</script>
</ui:composition>

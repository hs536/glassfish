<!--
    Prototype (adr/0008): the tabs of the web container pages (the counterpart of webContainerTabs.inc). The tab of the
    page itself is the selected one, so the pages need no session attribute.
    Parameters: bean (a WebContainerView), selected (general, session, manager or store).
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18nweb" value="#{consoleBundles.get('web', 'org.glassfish.web.admingui.Strings')}"/>

    <adm:tabSet id="webContainerTabs">
        <adm:tab label="#{i18n['common.General']}" url="#{bean.generalPage}" selected="#{selected eq 'general'}"/>
        <adm:tab label="#{i18nweb['webContainer.sessionProp']}" url="#{bean.sessionPage}" selected="#{selected eq 'session'}"/>
        <adm:tab label="#{i18nweb['webContainer.managerProp']}" url="#{bean.managerPage}" selected="#{selected eq 'manager'}"/>
        <adm:tab label="#{i18nweb['webContainer.storeProp']}" url="#{bean.storePage}" selected="#{selected eq 'store'}"/>
    </adm:tabSet>
</ui:composition>

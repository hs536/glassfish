<!--
    Prototype (adr/0006, adr/0008, adr/0009): the HTTP service page as a Facelets page. It takes precedence over
    accessLog.jsf and edits the HTTP service and its access log.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18nweb" value="#{consoleBundles.get('web', 'org.glassfish.web.admingui.Strings')}"/>
    <c:set var="bean" value="#{accessLogView}"/>

    <h:form id="form1">
        <adm:pageTitle id="propertyContentPage" title="#{i18nweb['httpService.pageTitle']}" helpText="#{i18nweb['httpService.pageTitleHelp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="saveButton" value="#{i18n['button.Save']}" styleClass="Btn1_sun4" action="#{bean.save}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                </h:panelGroup>
            </f:facet>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <adm:propertySheet id="configNameSheet">
            <adm:property id="configName" label="#{i18n['common.ConfigurationName']}">
                <h:outputText id="config" value="#{bean.configName}"/>
            </adm:property>
        </adm:propertySheet>

        <adm:propertySheet id="http">
            <adm:property id="ssoProp" label="#{i18nweb['access.SsoEnbaled']}" for="ssoEnabled" helpText="#{i18nweb['access.SsoEnabledHelp']}">
                <h:selectBooleanCheckbox id="ssoEnabled" value="#{bean.ssoEnabled}"/>
            </adm:property>
        </adm:propertySheet>

        <adm:propertySheet id="accessLog" legend="#{i18nweb['access.SectionTitle']}">
            <adm:property id="acLog" label="#{i18nweb['vs.accessLogging']}" for="accessLoggingEnabled">
                <h:selectBooleanCheckbox id="accessLoggingEnabled" value="#{bean.accessLoggingEnabled}"/>
            </adm:property>
            <adm:property id="rotationProp" label="#{i18nweb['access.Rotation']}" for="rotationEnabled" helpText="#{i18nweb['access.RotationHelp']}">
                <h:selectBooleanCheckbox id="rotationEnabled" value="#{bean.rotationEnabled}"/>
            </adm:property>
            <adm:property id="rotationPolicyProp" label="#{i18nweb['access.RotationPolicy']}" for="RotationPolicy"
                          helpText="#{i18nweb['access.RotationPolicyHelp']}">
                <h:selectOneMenu id="RotationPolicy" value="#{bean.logValues['rotationPolicy']}" styleClass="MnuStd_sun4">
                    <f:selectItems value="#{bean.policies}"/>
                </h:selectOneMenu>
            </adm:property>
            <adm:property id="intervalProp" label="#{i18nweb['access.RotationInterval']}" for="Interval"
                          helpText="#{i18nweb['access.RotationIntervalHelp']}">
                <h:inputText id="Interval" value="#{bean.logValues['rotationIntervalInMinutes']}" size="30" maxlength="512"
                             styleClass="integer TxtFld_sun4"/>
                <h:outputText id="minutes" value="#{i18n['common.Minutes']}" style="padding: 8pt"/>
            </adm:property>
            <adm:property id="suffixProp" label="#{i18nweb['access.RotationSuffix']}" for="Suffix" helpText="#{i18nweb['access.RotationSuffixHelp']}">
                <h:inputText id="Suffix" value="#{bean.logValues['rotationSuffix']}" size="30" maxlength="512" styleClass="TxtFld_sun4"/>
            </adm:property>
            <adm:property id="MaxHistoryFilesProp" label="#{i18nweb['access.MaxHistoryFiles']}" for="MaxHistoryFiles"
                          helpText="#{i18nweb['access.MaxHistoryFilesHelp']}">
                <h:inputText id="MaxHistoryFiles" value="#{bean.logValues['maxHistoryFiles']}" size="30" maxlength="512"
                             styleClass="TxtFld_sun4"/>
            </adm:property>
            <adm:property id="accessLogBufferSizeProp" label="#{i18nweb['access.accessLogBufferSize']}" for="accessLogBufferSize"
                          helpText="#{i18nweb['access.accessLogBufferSizeHelp']}">
                <h:inputText id="accessLogBufferSize" value="#{bean.logValues['bufferSizeBytes']}" size="30" maxlength="512"
                             styleClass="intAllowMinus TxtFld_sun4"/>
                <h:outputText id="bytes" value="#{i18n['common.Bytes']}" style="padding: 8pt"/>
            </adm:property>
            <adm:property id="accessLogWriteIntervalProp" label="#{i18nweb['access.accessLogWriteInterval']}" for="accessLogWriteInterval"
                          helpText="#{i18nweb['access.accessLogWriteIntervalHelp']}">
                <h:inputText id="accessLogWriteInterval" value="#{bean.logValues['writeIntervalSeconds']}" size="30" maxlength="512"
                             styleClass="intAllowMinus TxtFld_sun4"/>
                <h:outputText id="seconds" value="#{i18n['common.Seconds']}" style="padding: 8pt"/>
            </adm:property>
            <adm:property id="formatProp" label="#{i18nweb['access.Format']}" for="Format" helpText="#{i18nweb['access.FormatHelp']}">
                <h:inputText id="Format" value="#{bean.logValues['format']}" size="90" maxlength="512" styleClass="TxtFld_sun4"/>
            </adm:property>
        </adm:propertySheet>

        <adm:propertyTable id="basicTable" rows="#{bean.properties}" title="#{i18n['common.AdditionalProperties']}"/>
    </h:form>
    <script>document.title = '#{i18nweb['httpService.pageTitle']}';</script>
</ui:composition>

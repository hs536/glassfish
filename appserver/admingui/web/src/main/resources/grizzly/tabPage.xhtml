<!--
    Prototype (adr/0008): one tab of a protocol, with its tabs, its buttons and the settings it shows. It is the
    Facelets counterpart of http.layout and fileCache.layout. A page says which Bean holds the settings ("bean"), which
    tab it is ("selected"), what it is called ("title", "titleHelp") and which fragment shows the settings
    ("fragment"); the fragment gets them as "settings".
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>

    <h:form id="propertyForm">
        <ui:include src="/web/grizzly/tabs.xhtml">
            <ui:param name="tabs" value="#{bean.tabs}"/>
            <ui:param name="selected" value="#{selected}"/>
        </ui:include>

        <adm:pageTitle id="propertyContentPage" title="#{title}" helpText="#{titleHelp}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="loadDefaultButton" value="#{i18n['button.LoadDefaults']}" styleClass="Btn2_sun4"
                                     action="#{bean.loadDefaults}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <h:commandButton id="saveButton" value="#{i18n['button.Save']}" styleClass="Btn1_sun4" rendered="#{bean.found}"
                                     action="#{bean.save}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <input id="propertyForm:cancelButton" type="button" class="Btn2_sun4" value="#{i18n['button.Cancel']}"
                           onclick="admingui.ajax.loadPage({url: '#{bean.tabs.cancelPage}'}); return false;"/>
                </h:panelGroup>
            </f:facet>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <adm:propertySheet id="configNameSheet">
            <adm:property id="configNameProp" label="#{i18n['common.ConfigurationName']}">
                <h:outputText id="config" value="#{bean.configName}"/>
            </adm:property>
        </adm:propertySheet>
        <ui:include src="#{fragment}">
            <ui:param name="settings" value="#{bean.settings}"/>
            <ui:param name="protocolName" value="#{bean.protocolName}"/>
        </ui:include>
    </h:form>
    <script>document.title = '#{title}';</script>
</ui:composition>

<!--
    Prototype (adr/0008, adr/0009): the page of the network configuration, which only links to the three pages below it.
    It takes precedence over networkConfig.jsf.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18nweb" value="#{consoleBundles.get('web', 'org.glassfish.web.admingui.Strings')}"/>
    <c:set var="configName" value="#{networkConfigView.configName}"/>

    <h:form id="propertyForm">
        <adm:pageTitle id="propertyContentPage" title="#{i18nweb['grizzly.networkConfigPageTitle']}"
                       helpText="#{i18nweb['grizzly.networkConfigPageTitleHelp']}"/>

        <adm:propertySheet id="configNameSheet">
            <adm:property id="configNameProp" label="#{i18n['common.ConfigurationName']}">
                <h:outputText id="config" value="#{configName}"/>
            </adm:property>
        </adm:propertySheet>

        <adm:propertySheet id="linkSheet">
            <ui:repeat value="#{networkConfigView.pages}" var="page">
                <tr>
                    <td valign="top" nowrap="nowrap"><div class="ConTblCl1Div_sun4"><span class="LblLev2Txt_sun4">&#160;</span></div></td>
                    <td>
                        <div class="ConTblCl2Div_sun4">
                            <h:outputLink id="link" value="#{page.url}" title="#{i18nweb[page.textKey]}">
                                <h:graphicImage value="/resource/web/images/http.gif" alt=""/>
                                <h:outputText value="#{i18nweb[page.textKey]}"/>
                            </h:outputLink>
                        </div>
                    </td>
                </tr>
            </ui:repeat>
        </adm:propertySheet>
    </h:form>
    <script>document.title = '#{i18nweb['grizzly.networkConfigPageTitle']}';</script>
</ui:composition>

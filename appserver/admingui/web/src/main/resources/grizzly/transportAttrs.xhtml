<!--
    Prototype (adr/0008): the attributes of a transport, shared by the new and the edit page (the counterpart of
    web/grizzly/transportAttr.inc). The byte buffer type keeps the value of the transport and shows it in upper case
    (B-40).
    Parameters: bean (TransportNewView or TransportEditView), edit (true on the edit page).
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18nweb" value="#{consoleBundles.get('web', 'org.glassfish.web.admingui.Strings')}"/>

    <adm:propertySheet id="configNameSheet">
        <adm:property id="configName" label="#{i18n['common.ConfigurationName']}">
            <h:outputText id="config" value="#{bean.configName}"/>
        </adm:property>
    </adm:propertySheet>

    <adm:propertySheet id="propertSectionTextField">
        <adm:property id="name" label="#{i18nweb['transport.transportName']}" rendered="#{edit}">
            <h:outputText id="transportName" value="#{bean.name}"/>
        </adm:property>
        <adm:property id="IdTextProp" label="#{i18nweb['transport.transportName']}" for="IdText" required="true" rendered="#{not edit}">
            <h:inputText id="IdText" value="#{bean.name}" size="60" maxlength="512" styleClass="required TxtFld_sun4" required="#{not edit}"
                         requiredMessage="#{i18n['msg.JS.enterValue']} #{i18nweb['transport.transportName']}"/>
        </adm:property>
        <adm:property id="Classname" label="#{i18nweb['transport.Classname']}" for="classname" helpText="#{i18nweb['transport.ClassnameHelp']}">
            <h:inputText id="classname" value="#{bean.values['classname']}" size="60" maxlength="512" styleClass="TxtFld_sun4"/>
        </adm:property>
        <adm:property id="SelectionKeyHandler" label="#{i18nweb['transport.SelectionKeyHandler']}" for="selectionKeyHandler"
                      helpText="#{i18nweb['transport.SelectionKeyHandlerHelp']}">
            <h:inputText id="selectionKeyHandler" value="#{bean.values['selectionKeyHandler']}" size="60" maxlength="512" styleClass="TxtFld_sun4"/>
        </adm:property>
        <adm:property id="ByteBufferType" label="#{i18nweb['transport.ByteBufferType']}" for="byteBufferType"
                      helpText="#{i18nweb['transport.ByteBufferTypeHelp']}">
            <h:selectOneMenu id="byteBufferType" value="#{bean.values['byteBufferType']}" styleClass="MnuStd_sun4">
                <f:selectItems value="#{bean.byteBufferTypes}" var="type" itemValue="#{type}" itemLabel="#{type.toUpperCase()}"/>
            </h:selectOneMenu>
        </adm:property>
        <adm:property id="BufferSizeBytes" label="#{i18nweb['transport.BufferSizeBytes']}" for="bufferSizeBytes"
                      helpText="#{i18nweb['transport.BufferSizeBytesHelp']}">
            <h:inputText id="bufferSizeBytes" value="#{bean.values['bufferSizeBytes']}" size="20" maxlength="512" styleClass="integer TxtFld_sun4"/>
            <h:outputText id="bytes" value="#{i18n['common.Bytes']}" style="padding: 8pt"/>
        </adm:property>
        <adm:property id="AcceptorThreads" label="#{i18nweb['transport.AcceptorThreads']}" for="acceptorThreads"
                      helpText="#{i18nweb['transport.AcceptorThreadsHelp']}">
            <h:inputText id="acceptorThreads" value="#{bean.values['acceptorThreads']}" size="20" maxlength="512"
                         styleClass="intAllowMinusOne TxtFld_sun4"/>
        </adm:property>
        <adm:property id="MaxConnectionsCount" label="#{i18nweb['transport.MaxConnectionsCount']}" for="maxConnectionsCount"
                      helpText="#{i18nweb['transport.MaxConnectionsCountHelp']}">
            <h:inputText id="maxConnectionsCount" value="#{bean.values['maxConnectionsCount']}" size="20" maxlength="512"
                         styleClass="integer TxtFld_sun4"/>
        </adm:property>
        <adm:property id="IdleKeyTimeoutSeconds" label="#{i18nweb['transport.IdleKeyTimeoutSeconds']}" for="idleKeyTimeoutSeconds"
                      helpText="#{i18nweb['transport.IdleKeyTimeoutSecondsHelp']}">
            <h:inputText id="idleKeyTimeoutSeconds" value="#{bean.values['idleKeyTimeoutSeconds']}" size="20" maxlength="512"
                         styleClass="integer TxtFld_sun4"/>
            <h:outputText id="sec" value="#{i18n['common.Seconds']}" style="padding: 8pt"/>
        </adm:property>
        <adm:property id="ReadTimeoutMillis" label="#{i18nweb['transport.ReadTimeoutMillis']}" for="readTimeoutMillis"
                      helpText="#{i18nweb['transport.ReadTimeoutMillisHelp']}">
            <h:inputText id="readTimeoutMillis" value="#{bean.values['readTimeoutMillis']}" size="20" maxlength="512"
                         styleClass="integer TxtFld_sun4"/>
            <h:outputText id="readMillis" value="#{i18n['common.Milliseconds']}" style="padding: 8pt"/>
        </adm:property>
        <adm:property id="SelectorPollTimeoutMillis" label="#{i18nweb['transport.SelectorPollTimeoutMillis']}" for="selectorPollTimeoutMillis"
                      helpText="#{i18nweb['transport.SelectorPollTimeoutMillisHelp']}">
            <h:inputText id="selectorPollTimeoutMillis" value="#{bean.values['selectorPollTimeoutMillis']}" size="20" maxlength="512"
                         styleClass="integer TxtFld_sun4"/>
            <h:outputText id="pollMillis" value="#{i18n['common.Milliseconds']}" style="padding: 8pt"/>
        </adm:property>
        <adm:property id="WriteTimeoutMillis" label="#{i18nweb['transport.WriteTimeoutMillis']}" for="writeTimeoutMillis"
                      helpText="#{i18nweb['transport.WriteTimeoutMillisHelp']}">
            <h:inputText id="writeTimeoutMillis" value="#{bean.values['writeTimeoutMillis']}" size="20" maxlength="512"
                         styleClass="integer TxtFld_sun4"/>
            <h:outputText id="writeMillis" value="#{i18n['common.Milliseconds']}" style="padding: 8pt"/>
        </adm:property>
        <adm:property id="DisplayConfiguration" label="#{i18nweb['transport.DisplayConfiguration']}" for="displayConfiguration"
                      helpText="#{i18nweb['transport.DisplayConfigurationHelp']}">
            <h:selectBooleanCheckbox id="displayConfiguration" value="#{bean.displayConfiguration}"/>
        </adm:property>
        <adm:property id="EnableSnoop" label="#{i18nweb['transport.EnableSnoop']}" for="enableSnoop" helpText="#{i18nweb['transport.EnableSnoopHelp']}">
            <h:selectBooleanCheckbox id="enableSnoop" value="#{bean.enableSnoop}"/>
        </adm:property>
        <adm:property id="TcpNoDelay" label="#{i18nweb['transport.TcpNoDelay']}" for="tcpNoDelay" helpText="#{i18nweb['transport.TcpNoDelayHelp']}">
            <h:selectBooleanCheckbox id="tcpNoDelay" value="#{bean.tcpNoDelay}"/>
        </adm:property>
    </adm:propertySheet>
</ui:composition>

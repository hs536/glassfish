<!--
    Prototype (adr/0006, adr/0008, adr/0009): the list of the protocols of a configuration as a Facelets page. It takes
    precedence over protocols.jsf. The new page, the edit page and the pages of the listeners are still JSFTemplating
    pages.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18nweb" value="#{consoleBundles.get('web', 'org.glassfish.web.admingui.Strings')}"/>
    <c:set var="bean" value="#{protocolsView}"/>

    <h:form id="propertyForm">
        <adm:pageTitle id="propertyContentPage" title="#{i18nweb['grizzly.protocolsPageTitle']}"
                       helpText="#{i18nweb['grizzly.protocolsPageTitleHelp']}"/>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <adm:propertySheet id="configNameSheet">
            <adm:property id="configName" label="#{i18n['common.ConfigurationName']}">
                <h:outputText id="config" value="#{bean.configName}"/>
            </adm:property>
        </adm:propertySheet>

        <adm:table id="configs" title="#{i18nweb['grizzly.protocol.tableName']}" count="#{bean.rows.size()}" columns="4">
            <f:facet name="actions">
                <adm:resourceTableActions id="actions" bean="#{bean}" newPage="#{bean.newPage}" enableActions="false"
                                          deleteConfirmation="#{i18nweb['msg.JS.confirmDeleteProtocol']}"/>
            </f:facet>
            <f:facet name="header">
                <h:panelGroup>
                    <adm:sortHeader text="#{i18n['common.SelectHeader']}" width="3%"/>
                    <adm:sortHeader id="nameHeader" text="#{i18nweb['grizzly.protocol.nameCol']}" key="name" sorter="#{bean}"/>
                    <adm:sortHeader text="#{i18nweb['grizzly.protocol.listenerNameCol']}"/>
                    <adm:sortHeader text="#{i18nweb['grizzly.protocol.securityEnabledCol']}"/>
                </h:panelGroup>
            </f:facet>
            <ui:repeat id="rows" value="#{bean.rows}" var="row">
                <tr>
                    <td class="TblTdSel_sun4" align="left">
                        <span class="CbSpn_sun4">
                            <h:selectBooleanCheckbox id="select" value="#{row.selected}" title="#{i18n['common.select']}">
                                <f:ajax render=":propertyForm:configs:actions"/>
                            </h:selectBooleanCheckbox>
                        </span>
                    </td>
                    <th class="TblTdLyt_sun4" align="left" scope="row">
                        <h:outputLink id="link" value="#{bean.editPage(row.name)}">#{row.name}</h:outputLink>
                    </th>
                    <td class="TblTdLyt_sun4" align="left">
                        <ui:repeat id="listeners" value="#{row.targets}" var="listener">
                            <h:outputLink id="listenerLink" value="#{bean.listenerPage(listener)}">#{listener}</h:outputLink>
                            <br/>
                        </ui:repeat>
                    </td>
                    <td class="TblTdLyt_sun4" align="left">#{row.attributes['securityEnabled']}</td>
                </tr>
            </ui:repeat>
        </adm:table>
            <input id="helpKey" type="hidden" value="#{consoleBundles.get('web', 'org.glassfish.web.admingui.Helplinks')['protocols']}"/>
    </h:form>
    <script>document.title = '#{i18nweb['grizzly.protocolsPageTitle']}';</script>
</ui:composition>

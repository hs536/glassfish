<!--
    Prototype (adr/0006, adr/0008, adr/0009): the file cache tab of a network listener as a Facelets page. It takes precedence over listenerFileCache.jsf and
    is the fragment tabPage.xhtml with the settings of the HTTP settings.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:c="jakarta.tags.core">
    <c:set var="i18nweb" value="#{consoleBundles.get('web', 'org.glassfish.web.admingui.Strings')}"/>
    <ui:include src="/web/grizzly/tabPage.xhtml">
        <ui:param name="bean" value="#{listenerFileCacheView}"/>
        <ui:param name="selected" value="fileCache"/>
        <ui:param name="title" value="#{i18nweb['grizzly.fileCachePageTitle']}"/>
        <ui:param name="titleHelp" value="#{i18nweb['grizzly.fileCachePageTitleHelp']}"/>
        <ui:param name="helpKey" value="fileCache"/>
        <ui:param name="fragment" value="/web/grizzly/fileCacheAttrs.xhtml"/>
    </ui:include>
</ui:composition>

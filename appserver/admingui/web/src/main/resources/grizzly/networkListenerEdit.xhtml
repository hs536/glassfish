<!--
    Prototype (adr/0006, adr/0008, adr/0009): an existing network listener as a Facelets page. It takes precedence over
    networkListenerEdit.jsf. The SSL, HTTP and File Cache tabs open the JSFTemplating pages of the protocol.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18nweb" value="#{consoleBundles.get('web', 'org.glassfish.web.admingui.Strings')}"/>
    <c:set var="bean" value="#{networkListenerEditView}"/>

    <h:form id="propertyForm">
        <adm:tabSet id="listenerTabs" rendered="#{bean.found}">
            <adm:tab label="#{i18nweb['grizzly.networkListener.listenerTab']}" selected="true"/>
            <adm:tab label="#{i18nweb['grizzly.sslTab']}" url="#{bean.sslPage}" rendered="#{bean.otherTabs}"/>
            <adm:tab label="#{i18nweb['grizzly.httpTab']}" url="#{bean.httpPage}" rendered="#{bean.otherTabs}"/>
            <adm:tab label="#{i18nweb['grizzly.fileCacheTab']}" url="#{bean.fileCachePage}" rendered="#{bean.otherTabs}"/>
        </adm:tabSet>

        <adm:pageTitle id="propertyContentPage" title="#{i18nweb['grizzly.networkListenerEditPageTitle']}"
                       helpText="#{i18nweb['grizzly.networkListenerEditPageTitleHelp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="saveButton" value="#{i18n['button.Save']}" styleClass="Btn1_sun4" rendered="#{bean.found}" action="#{bean.save}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <input id="propertyForm:cancelButton" type="button" class="Btn2_sun4" value="#{i18n['button.Cancel']}"
                           onclick="admingui.ajax.loadPage({url: '#{bean.listPage}'}); return false;"/>
                </h:panelGroup>
            </f:facet>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <ui:fragment rendered="#{bean.found}">
            <adm:propertySheet id="configNameSheet">
                <adm:property id="configName" label="#{i18n['common.ConfigurationName']}">
                    <h:outputText id="config" value="#{bean.configName}"/>
                </adm:property>
            </adm:propertySheet>

            <adm:propertySheet id="propertSectionTextField">
                <adm:property id="nameStatic" label="#{i18nweb['common.name']}">
                    <h:outputText id="listenerName" value="#{bean.name}"/>
                </adm:property>
                <adm:property id="protocolProp" label="#{i18nweb['grizzly.protocol']}">
                    <h:outputText id="protocolName" value="#{bean.protocol}"/>
                </adm:property>
                <adm:property id="port" label="#{i18nweb['grizzly.networkListener.port']}" for="portField" required="true"
                              helpText="#{i18nweb['grizzly.networkListener.portHelp']}">
                    <h:inputText id="portField" value="#{bean.values['port']}" size="40" maxlength="512" styleClass="required port TxtFld_sun4"
                                 required="true" requiredMessage="#{i18n['msg.JS.enterValue']} #{i18nweb['grizzly.networkListener.port']}"/>
                </adm:property>
                <adm:property id="addr" label="#{i18nweb['grizzly.networkListener.address']}" for="address"
                              helpText="#{i18nweb['grizzly.networkListener.addressHelp']}">
                    <h:inputText id="address" value="#{bean.values['address']}" size="40" maxlength="512" styleClass="TxtFld_sun4"/>
                </adm:property>
                <adm:property id="status" label="#{i18nweb['common.status']}" for="enabled" helpText="#{i18nweb['grizzly.networkListener.statusHelp']}">
                    <h:selectBooleanCheckbox id="enabled" value="#{bean.enabled}"/>
                </adm:property>
                <adm:property id="security" label="#{i18nweb['grizzly.networkListener.security']}" for="securityEnabled"
                              helpText="#{i18nweb['grizzly.networkListener.securityHelp']}">
                    <h:selectBooleanCheckbox id="securityEnabled" value="#{bean.securityEnabled}" disabled="#{bean.readOnly}"/>
                </adm:property>
                <adm:property id="JkEnabled" label="#{i18nweb['grizzly.networkListener.JkEnabled']}" for="jkEnabled"
                              helpText="#{i18nweb['grizzly.networkListener.JkEnabledHelp']}">
                    <h:selectBooleanCheckbox id="jkEnabled" value="#{bean.jkEnabled}"/>
                </adm:property>
                <adm:property id="threadpool" label="#{i18nweb['grizzly.networkListener.threadPool']}" for="threadPool"
                              helpText="#{i18nweb['grizzly.networkListener.threadPoolHelp']}">
                    <h:selectOneMenu id="threadPool" value="#{bean.values['threadPool']}" styleClass="MnuStd_sun4">
                        <f:selectItems value="#{bean.threadPools}"/>
                    </h:selectOneMenu>
                    <h:outputLink id="threadPoolEditLink" value="#{bean.threadPoolPage}" style="margin-left: 10px;">#{i18nweb['grizzly.networkListener.editThreadPool']}</h:outputLink>
                </adm:property>
                <adm:property id="transport" label="#{i18nweb['grizzly.networkListener.transport']}" for="transportField"
                              helpText="#{i18nweb['grizzly.networkListener.transportHelp']}">
                    <h:selectOneMenu id="transportField" value="#{bean.values['transport']}" styleClass="MnuStd_sun4">
                        <f:selectItems value="#{bean.transports}"/>
                    </h:selectOneMenu>
                </adm:property>
            </adm:propertySheet>
        </ui:fragment>
            <input id="helpKey" type="hidden" value="#{consoleBundles.get('web', 'org.glassfish.web.admingui.Helplinks')['networkListenerEdit']}"/>
    </h:form>
    <script>document.title = '#{i18nweb['grizzly.networkListenerEditPageTitle']}';</script>
</ui:composition>

<!--
    Prototype (adr/0008): the tabs of a protocol, which the pages of the protocol itself and of a network listener
    share. It is the Facelets counterpart of listenerTabs.inc and protocolTabs.inc; "tabs" is a
    org.glassfish.web.admingui.prototype.GrizzlyTabs and "selected" is one of general, ssl, http and fileCache.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18nweb" value="#{consoleBundles.get('web', 'org.glassfish.web.admingui.Strings')}"/>
    <adm:tabSet id="protocolTabs">
        <adm:tab label="#{tabs.listener ? i18nweb['grizzly.networkListener.listenerTab'] : i18nweb['grizzly.protocolTab']}"
                 url="#{tabs.generalPage}" selected="#{selected eq 'general'}"/>
        <adm:tab label="#{i18nweb['grizzly.sslTab']}" url="#{tabs.sslPage}" selected="#{selected eq 'ssl'}" rendered="#{empty otherTabs or otherTabs}"/>
        <adm:tab label="#{i18nweb['grizzly.httpTab']}" url="#{tabs.httpPage}" selected="#{selected eq 'http'}" rendered="#{empty otherTabs or otherTabs}"/>
        <adm:tab label="#{i18nweb['grizzly.fileCacheTab']}" url="#{tabs.fileCachePage}" selected="#{selected eq 'fileCache'}"
                 rendered="#{empty otherTabs or otherTabs}"/>
    </adm:tabSet>
</ui:composition>

<!--
    Prototype (adr/0006, adr/0008, adr/0009): the HTTP tab of a protocol as a Facelets page. It takes precedence over protocolHttp.jsf and
    is the fragment tabPage.xhtml with the settings of a protocol.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:c="jakarta.tags.core">
    <c:set var="i18nweb" value="#{consoleBundles.get('web', 'org.glassfish.web.admingui.Strings')}"/>
    <ui:include src="/web/grizzly/tabPage.xhtml">
        <ui:param name="bean" value="#{protocolHttpView}"/>
        <ui:param name="selected" value="http"/>
        <ui:param name="title" value="#{i18nweb['grizzly.httpPageTitle']}"/>
        <ui:param name="titleHelp" value="#{i18nweb['grizzly.httpPageTitleHelp']}"/>
        <ui:param name="fragment" value="/web/grizzly/httpAttrs.xhtml"/>
    </ui:include>
</ui:composition>

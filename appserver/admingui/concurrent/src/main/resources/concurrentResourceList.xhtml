<!--
    Prototype (adr/0006, adr/0008, adr/0009): the list of a concurrent resource type, shared by the list pages (the
    Facelets counterpart of concurrent/resourcesTable.inc). Parameters: bean (a ResourceListView), titleKey and
    tableTitleKey (message keys of the page title and the table title; the help text is titleKey + 'Help'), newPage and
    editPage (paths), confirmKey (message key of the delete confirmation), threadPriority (true to show the thread
    priority column).
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18ncon" value="#{consoleBundles.get('concurrent', 'org.glassfish.concurrent.admingui.Strings')}"/>

    <h:form id="propertyForm">
        <adm:pageTitle id="propertyContentPage" title="#{i18ncon[titleKey]}" helpText="#{i18ncon[titleKey.concat('Help')]}"/>
        <br/><br/>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <adm:table id="resourcesTable" title="#{i18ncon[tableTitleKey]}" count="#{bean.rows.size()}" columns="#{threadPriority ? 7 : 6}">
            <f:facet name="actions">
                <adm:resourceTableActions id="actions" bean="#{bean}" newPage="#{newPage}" deleteConfirmation="#{i18ncon[confirmKey]}"/>
            </f:facet>
            <f:facet name="header">
                <h:panelGroup>
                    <adm:sortHeader text="#{i18n['common.SelectHeader']}" width="3%"/>
                    <adm:sortHeader id="nameHeader" text="#{i18ncon['resourcesTable.colJndiName']}" key="name" sorter="#{bean}"/>
                    <adm:sortHeader id="logicalNameHeader" text="#{i18n['common.resourcesTable.colLogicalJndiName']}" key="logicalJndiName" sorter="#{bean}"/>
                    <adm:sortHeader id="statusHeader" text="#{bean.onlyServer ? i18n['deployTable.colEnabled'] : i18n['deployTable.colStatus']}" key="status" sorter="#{bean}"/>
                    <adm:sortHeader id="contextInfoHeader" text="#{i18ncon['resourcesTable.colContextInfo']}" key="contextInfo" sorter="#{bean}"/>
                    <ui:fragment rendered="#{threadPriority}">
                        <adm:sortHeader id="threadPriorityHeader" text="#{i18ncon['resourcesTable.colThreadPriority']}" key="threadPriority" sorter="#{bean}"/>
                    </ui:fragment>
                    <adm:sortHeader text="#{i18ncon['resourcesTable.colDesc']}"/>
                </h:panelGroup>
            </f:facet>
            <ui:repeat id="rows" value="#{bean.rows}" var="row">
                <tr>
                    <td class="TblTdSel_sun4" align="left">
                        <span class="CbSpn_sun4">
                            <h:selectBooleanCheckbox id="select" value="#{row.selected}" title="#{i18n['common.select']}">
                                <f:ajax render=":propertyForm:resourcesTable:actions"/>
                            </h:selectBooleanCheckbox>
                        </span>
                    </td>
                    <th class="TblTdLyt_sun4" align="left" scope="row">
                        <h:outputLink id="link" value="#{request.contextPath}#{editPage}">
                            <f:param name="name" value="#{row.name}"/>
                            <f:param name="logicalJndiName" value="#{row.logicalJndiName}"/>
                            #{row.name}
                        </h:outputLink>
                    </th>
                    <td class="TblTdLyt_sun4" align="left">#{row.logicalJndiName}</td>
                    <td class="TblTdLyt_sun4" align="left">
                        <h:outputLink id="targetLink" rendered="#{not bean.onlyServer}"
                                      value="#{request.contextPath}/common/resourceNode/resourceEditTargets.jsf">
                            <f:param name="name" value="#{row.name}"/>
                            <f:param name="generalPage" value="#{editPage}?name=#{row.name}"/>
                            #{bean.status(row)}
                        </h:outputLink>
                        <h:graphicImage id="enabledImage" rendered="#{bean.onlyServer}"
                                        value="/resource/images/#{bean.enabledOnServer(row) ? 'enabled.png' : 'disabled.png'}"/>
                    </td>
                    <td class="TblTdLyt_sun4" align="left">#{row.attributes['contextInfoEnabled'] eq 'true' ? row.attributes['contextInfo'] : ''}</td>
                    <ui:fragment rendered="#{threadPriority}">
                        <td class="TblTdLyt_sun4" align="left">#{row.attributes['threadPriority']}</td>
                    </ui:fragment>
                    <td class="TblTdLyt_sun4" align="left">#{row.attributes['description']}</td>
                </tr>
            </ui:repeat>
        </adm:table>
            <input id="helpKey" type="hidden" value="#{consoleBundles.get('concurrent', 'org.glassfish.concurrent.admingui.Helplinks')[helpKey]}"/>
    </h:form>
    <script>document.title = '#{i18ncon[titleKey]}';</script>
</ui:composition>

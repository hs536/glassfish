<!--
    Prototype (adr/0008): the context information rows of a concurrent resource, included in a property sheet (the
    Facelets counterpart of concurrent/contextInfo.inc). Parameter: bean (a concurrent resource new or edit view).
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18ncon" value="#{consoleBundles.get('concurrent', 'org.glassfish.concurrent.admingui.Strings')}"/>

    <adm:property id="ctxInfoEnabledProp" label="#{i18ncon['contextInfoLabel']}" for="ctxInfoEnabled">
        <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="ctxInfoEnabled" value="#{bean.concurrent.flags['contextInfoEnabled']}"/></span>
    </adm:property>
    <adm:property id="contextInfoProp" label="" helpText="#{i18ncon['contextInfoLabelHelp']}">
        <h:selectManyListbox id="contextInfo" value="#{bean.concurrent.contextInfo}" size="6" styleClass="Lst_sun4"
                             collectionType="java.util.ArrayList" pt:aria-label="#{i18ncon['resourcesTable.colContextInfo']}">
            <f:selectItems value="#{bean.concurrent.contextOptions}"/>
        </h:selectManyListbox>
        <h:outputText id="select" value="#{i18ncon['contextInfoSelection']}"/>
    </adm:property>
</ui:composition>

<!--
    Prototype (adr/0008): the attributes of a managed executor service or a managed scheduled executor service, shared
    by their new and edit pages (the Facelets counterpart of concurrent/managedExecutorServiceAttr.inc). Parameters: bean
    (a concurrent resource new or edit view), edit (true on the edit page), poolLimits (true to show the maximum pool
    size and the task queue capacity, which a scheduled executor service does not have).
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18ncon" value="#{consoleBundles.get('concurrent', 'org.glassfish.concurrent.admingui.Strings')}"/>

    <adm:propertySheet id="propertySheet">
        <adm:property id="nameNewProp" label="#{i18n['common.jndiName']}" for="name" required="true" rendered="#{not edit}">
            <h:inputText id="name" value="#{bean.values['name']}" size="30" maxlength="512" styleClass="required TxtFld_sun4"
                         required="#{not edit}" requiredMessage="#{i18n['msg.JS.enterValue']} #{i18n['common.jndiName']}"
                         validator="#{bean.validateName}"/>
        </adm:property>
        <adm:property id="nameProp" label="#{i18n['common.jndiName']}" rendered="#{edit}">
            <h:outputText id="name" value="#{bean.name}"/>
        </adm:property>
        <adm:property id="logicalName" label="#{i18n['common.logicalJndiName']}" rendered="#{edit and not empty bean.logicalJndiName}">
            <h:outputText id="lName" value="#{bean.logicalJndiName}"/>
        </adm:property>
        <ui:include src="/concurrent/contextInfo.xhtml"/>
        <adm:property id="statusProp" label="#{i18n['common.status']}" for="enabled" rendered="#{not edit or bean.onlyServer}">
            <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="enabled" value="#{bean.enabled}"/></span>
        </adm:property>
        <adm:property id="statusProp2" label="#{i18n['common.status']}" rendered="#{edit and not bean.onlyServer}"
                      helpText="#{i18n['application.EnableTargetHelp']}">
            <h:outputText id="enabledStr" value="#{bean.status}"/>
        </adm:property>
        <adm:property id="threadPriorityProp" label="#{i18ncon['threadPriorityLabel']}" for="threadPriority" helpText="#{i18ncon['threadPriorityLabelHelp']}">
            <h:inputText id="threadPriority" value="#{bean.values['threadPriority']}" size="55" maxlength="512" styleClass="integer TxtFld_sun4"/>
        </adm:property>
        <adm:property id="useVirtualThreadsProp" label="#{i18ncon['usevirtualthreads']}" for="useVirtualThreads">
            <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="useVirtualThreads" value="#{bean.concurrent.flags['useVirtualThreads']}"/></span>
        </adm:property>
        <adm:property id="longRunningTasksProp" label="#{i18ncon['longRunningTasks']}" for="longRunningTasks">
            <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="longRunningTasks" value="#{bean.concurrent.flags['longRunningTasks']}"/></span>
        </adm:property>
        <adm:property id="hungAfterProp" label="#{i18ncon['hungAfterSeconds']}" for="hungAfter" helpText="#{i18ncon['hungAfterSecondsHelp']}">
            <h:inputText id="hungAfter" value="#{bean.values['hungAfterSeconds']}" size="55" maxlength="512" styleClass="integer TxtFld_sun4"/>
            <h:outputText value="#{i18n['common.Seconds']}" style="padding: 8pt"/>
        </adm:property>
        <adm:property id="hungLoggerPrintOnceProp" label="#{i18ncon['hungLoggerPrintOnce']}" for="hungLoggerPrintOnce">
            <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="hungLoggerPrintOnce" value="#{bean.concurrent.flags['hungLoggerPrintOnce']}"/></span>
        </adm:property>
        <adm:property id="hungLoggerInitialDelayProp" label="#{i18ncon['hungLoggerInitialDelaySeconds']}" for="hungLoggerInitialDelay"
                      helpText="#{i18ncon['hungLoggerInitialDelaySecondsHelp']}">
            <h:inputText id="hungLoggerInitialDelay" value="#{bean.values['hungLoggerInitialDelaySeconds']}" size="55" maxlength="512" styleClass="integer TxtFld_sun4"/>
            <h:outputText value="#{i18n['common.Seconds']}" style="padding: 8pt"/>
        </adm:property>
        <adm:property id="hungLoggerIntervalProp" label="#{i18ncon['hungLoggerIntervalSeconds']}" for="hungLoggerInterval"
                      helpText="#{i18ncon['hungLoggerIntervalSecondsHelp']}">
            <h:inputText id="hungLoggerInterval" value="#{bean.values['hungLoggerIntervalSeconds']}" size="55" maxlength="512" styleClass="integer TxtFld_sun4"/>
            <h:outputText value="#{i18n['common.Seconds']}" style="padding: 8pt"/>
        </adm:property>
        <adm:property id="deploymentOrderProp" label="#{i18n['common.resource.deploymentOrder']}" for="deploymentOrder" rendered="#{edit}"
                      helpText="#{i18n['common.resource.deploymentOrderHelp']}">
            <h:inputText id="deploymentOrder" value="#{bean.values['deploymentOrder']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
        </adm:property>
        <adm:property id="descProp" label="#{i18n['common.description']}" for="desc">
            <h:inputText id="desc" value="#{bean.values['description']}" size="55" maxlength="512" styleClass="TxtFld_sun4"/>
        </adm:property>
    </adm:propertySheet>

    <adm:propertySheet id="poolSettings" legend="#{i18ncon['propertySheetSection.poolSettings']}">
        <adm:property id="coreSizeProp" label="#{i18ncon['corePoolSize']}" for="coreSize" helpText="#{i18ncon['corePoolSizeHelp']}">
            <h:inputText id="coreSize" value="#{bean.values['corePoolSize']}" size="55" maxlength="512" styleClass="integer TxtFld_sun4"/>
        </adm:property>
        <adm:property id="maximumPoolSizeProp" label="#{i18ncon['maximumPoolSize']}" for="maximumPoolSize" rendered="#{poolLimits}"
                      helpText="#{i18ncon['maximumPoolSizeHelp']}">
            <h:inputText id="maximumPoolSize" value="#{bean.values['maximumPoolSize']}" size="55" maxlength="512" styleClass="integer TxtFld_sun4"/>
        </adm:property>
        <adm:property id="keepAliveProp" label="#{i18ncon['keepAliveSeconds']}" for="keepAlive" helpText="#{i18ncon['keepAliveSecondsHelp']}">
            <h:inputText id="keepAlive" value="#{bean.values['keepAliveSeconds']}" size="55" maxlength="512" styleClass="integer TxtFld_sun4"/>
            <h:outputText value="#{i18n['common.Seconds']}" style="padding: 8pt"/>
        </adm:property>
        <adm:property id="threadLifetimeProp" label="#{i18ncon['threadLifetimeSeconds']}" for="threadLifetime" helpText="#{i18ncon['threadLifetimeSecondsHelp']}">
            <h:inputText id="threadLifetime" value="#{bean.values['threadLifetimeSeconds']}" size="55" maxlength="512" styleClass="integer TxtFld_sun4"/>
            <h:outputText value="#{i18n['common.Seconds']}" style="padding: 8pt"/>
        </adm:property>
        <adm:property id="taskQueueCapacityProp" label="#{i18ncon['taskQueueCapacity']}" for="taskQueueCapacity" rendered="#{poolLimits}"
                      helpText="#{i18ncon['taskQueueCapacityHelp']}">
            <h:inputText id="taskQueueCapacity" value="#{bean.values['taskQueueCapacity']}" size="55" maxlength="512" styleClass="integer TxtFld_sun4"/>
        </adm:property>
    </adm:propertySheet>
</ui:composition>

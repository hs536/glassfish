<!--
    Prototype (docs/試作計画.md P-7): the Facelets content of the integration point
    org.glassfish:admingui:TargetSectionForResource (registered with the content /shared/targetSectionForCreate.inc).
    The page reads the chosen targets from the targetSelection bean.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <adm:propertySheet id="targetSection" legend="#{i18n['common.TargetTableTitle']}" rendered="#{targetSelection.visible}">
        <tr>
            <td valign="top" nowrap="nowrap"><div class="ConTblCl1Div_sun4"><span class="LblLev2Txt_sun4">&#160;</span></div></td>
            <td>
                <div class="ConTblCl2Div_sun4">
                    <adm:addRemove id="addRemove" list="#{targetSelection.targets}" availableLabel="#{i18n['manageTargets.AvailableTargets']}:"
                                   selectedLabel="#{i18n['manageTargets.SelectedTargets']}:"/>
                </div>
            </td>
        </tr>
    </adm:propertySheet>
</ui:composition>

<!--
    Prototype (adr/0008): the attributes of a custom resource, shared by the new and edit pages (the Facelets
    counterpart of full/jndiResourceAttr.inc). Parameters: bean (CustomResourceNewView or CustomResourceEditView),
    edit (true on the edit page), formId (the id of the enclosing form, for the rows rendered again when the resource
    type changes).
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18nfull" value="#{consoleBundles.get('full', 'org.glassfish.full.admingui.Strings')}"/>
    <c:set var="typeRows" value=":#{formId}:propertySheet:typeProp :#{formId}:propertySheet:factoryClassProp"/>

    <adm:propertySheet id="propertySheet">
        <adm:property id="nameProp" label="#{i18n['common.jndiName']}" rendered="#{edit}">
            <h:outputText id="name" value="#{bean.name}"/>
        </adm:property>
        <adm:property id="nameNewProp" label="#{i18n['common.jndiName']}" for="nameNew" required="true" rendered="#{not edit}">
            <h:inputText id="nameNew" value="#{bean.values['name']}" size="30" maxlength="512" styleClass="required TxtFld_sun4"
                         required="#{not edit}" requiredMessage="#{i18n['msg.JS.enterValue']} #{i18n['common.jndiName']}"
                         validator="#{bean.validateName}"/>
        </adm:property>
        <adm:property id="typeProp" label="#{i18n['common.resType']}" for="builtInOption" helpText="#{i18nfull['jndiResource.resTypeHelp']}">
            <h:selectOneRadio id="builtInOption" group="resourceTypeOption" value="#{bean.type.option}">
                <f:selectItem itemValue="predefine" itemLabel=""/>
                <f:ajax execute="builtInOption typedOption" listener="#{bean.typeChanged}" render="#{typeRows}"/>
            </h:selectOneRadio>
            <h:selectOneMenu id="builtInType" value="#{bean.type.builtInType}" disabled="#{not bean.type.builtIn}" styleClass="MnuStd_sun4"
                             pt:aria-label="#{i18n['common.resType']}">
                <f:selectItem itemValue="" itemLabel=""/>
                <f:selectItems value="#{bean.type.builtInTypes}"/>
                <f:ajax execute="@this" listener="#{bean.typeChanged}" render=":#{formId}:propertySheet:factoryClassProp"/>
            </h:selectOneMenu>
            <br/><br/>
            <h:selectOneRadio id="typedOption" group="resourceTypeOption">
                <f:selectItem itemValue="input" itemLabel=""/>
                <f:ajax execute="builtInOption typedOption" listener="#{bean.typeChanged}" render="#{typeRows}"/>
            </h:selectOneRadio>
            <h:inputText id="typedType" value="#{bean.type.typedType}" size="70" maxlength="1024" disabled="#{bean.type.builtIn}"
                         styleClass="TxtFld_sun4" pt:aria-label="#{i18n['common.resType']}"/>
        </adm:property>
        <adm:property id="factoryClassProp" label="#{i18nfull['jndiResource.factoryClass']}" for="factoryClass" required="true"
                      helpText="#{i18nfull['customResource.factoryClassHelp']}">
            <h:inputText id="factoryClass" value="#{bean.values['factoryClass']}" size="70" maxlength="1024" styleClass="required TxtFld_sun4"
                         required="true" requiredMessage="#{i18n['msg.JS.enterValue']} #{i18nfull['jndiResource.factoryClass']}"/>
        </adm:property>
        <adm:property id="deploymentOrderProp" label="#{i18n['common.resource.deploymentOrder']}" for="deploymentOrder" rendered="#{edit}"
                      helpText="#{i18n['common.resource.deploymentOrderHelp']}">
            <h:inputText id="deploymentOrder" value="#{bean.values['deploymentOrder']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
        </adm:property>
        <adm:property id="descProp" label="#{i18n['common.description']}" for="desc">
            <h:inputText id="desc" value="#{bean.values['description']}" size="70" maxlength="512" styleClass="TxtFld_sun4"/>
        </adm:property>
        <adm:property id="statusProp" label="#{i18n['common.status']}" for="enabled" rendered="#{not edit or bean.onlyServer}">
            <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="enabled" value="#{bean.enabled}"/></span>
        </adm:property>
        <adm:property id="statusProp2" label="#{i18n['common.status']}" rendered="#{edit and not bean.onlyServer}"
                      helpText="#{i18n['application.EnableTargetHelp']}">
            <h:outputText id="enabledStr" value="#{bean.status}"/>
        </adm:property>
    </adm:propertySheet>
</ui:composition>

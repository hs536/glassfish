<!--
    Prototype (adr/0006, adr/0008): the edit admin object resource page as a Facelets page. It takes precedence over
    adminObjectEdit.jsf. The Target tab opens the JSFTemplating page common/resourceNode/resourceEditTargets.jsf.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njca" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Strings')}"/>
    <c:set var="bean" value="#{adminObjectEditView}"/>

    <h:form id="propertyForm">
        <adm:tabSet id="resEditTabs" rendered="#{bean.found and not bean.onlyServer}">
            <adm:tab label="#{i18n['common.General']}" selected="true"/>
            <adm:tab label="#{i18n['common.TargetTab']}" url="#{bean.targetPage}"/>
        </adm:tabSet>

        <adm:pageTitle id="propertyContentPage" title="#{i18njca['adminObjectResource.editPageTitle']}"
                       helpText="#{i18njca['adminObjectResource.editPageHelp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="saveButton" value="#{i18n['button.Save']}" styleClass="Btn1_sun4" rendered="#{bean.found}" action="#{bean.save}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <input id="propertyForm:cancelButton" type="button" class="Btn2_sun4" value="#{i18n['button.Cancel']}"
                           onclick="admingui.ajax.loadPage({url: '#{request.contextPath}/jca/adminObjectResources.jsf'}); return false;"/>
                </h:panelGroup>
            </f:facet>
            <h:commandButton id="loadDefaultsButton" value="#{i18n['button.LoadDefaults']}" styleClass="Btn2_sun4" style="margin-left: 8pt"
                             rendered="#{bean.found}" action="#{bean.loadDefaults}">
                <f:ajax execute="@form" render="@form"/>
            </h:commandButton>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <ui:fragment rendered="#{bean.found}">
            <ui:include src="/jca/adminObjectAttr.xhtml">
                <ui:param name="bean" value="#{bean}"/>
                <ui:param name="edit" value="#{true}"/>
                <ui:param name="formId" value="propertyForm"/>
                <ui:param name="dependents" value=""/>
            </ui:include>
            <adm:propertyTable id="basicTable" rows="#{bean.properties}" title="#{i18n['common.AdditionalProperties']}"/>
        </ui:fragment>
    </h:form>
    <script>document.title = '#{i18njca['adminObjectResource.editPageTitle']}';</script>
</ui:composition>

<!--
    Prototype (adr/0006, adr/0008, adr/0009): a new resource adapter config as a Facelets page. It takes precedence over
    resourceAdapterConfigNew.jsf. The name comes from the list of the deployed resource adapters or from the text field;
    choosing an adapter fills the properties table with its configuration properties.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njca" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Strings')}"/>
    <c:set var="bean" value="#{resourceAdapterConfigNewView}"/>
    <c:set var="nameRow" value=":propertyForm:propertSectionTextField:nameNewDropDown"/>
    <c:set var="nameFields" value=":propertyForm:propertSectionTextField:nameNewDropDown:resAdaptorProp :propertyForm:propertSectionTextField:nameNewDropDown:nameNewText"/>

    <h:form id="propertyForm">
        <adm:pageTitle id="propertyContentPage" title="#{i18njca['resourceAdapterConfig.newPageTitle']}"
                       helpText="#{i18njca['resourceAdapterConfig.newPageTitleHelp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="newButton" value="#{i18n['button.OK']}" styleClass="Btn1_sun4" action="#{bean.create}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <input id="propertyForm:cancelButton" type="button" class="Btn2_sun4" value="#{i18n['button.Cancel']}"
                           onclick="admingui.ajax.loadPage({url: '#{bean.listPage}'}); return false;"/>
                </h:panelGroup>
            </f:facet>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <adm:propertySheet id="propertSectionTextField">
            <adm:property id="nameNewDropDown" label="#{i18njca['resourceAdapterConfig.Name']}" for="resAdaptorProp"
                          helpText="#{i18njca['resourceAdapterConfig.NameHelp']}">
                <h:selectOneRadio id="optA" group="nameOption" value="#{bean.nameOption}">
                    <f:selectItem itemValue="dropdown" itemLabel=""/>
                    <f:ajax execute="@this #{nameFields}" render="#{nameRow} :propertyForm:basicTable"/>
                </h:selectOneRadio>
                <h:selectOneMenu id="resAdaptorProp" value="#{bean.nameFromList}" styleClass="MnuStd_sun4" disabled="#{not bean.fromList}">
                    <f:selectItems value="#{bean.adapters}"/>
                    <f:ajax execute="@this" render="#{nameRow} :propertyForm:basicTable"/>
                </h:selectOneMenu>
                <br/>
                <h:selectOneRadio id="optB" group="nameOption" value="#{bean.nameOption}">
                    <f:selectItem itemValue="text" itemLabel=""/>
                    <f:ajax execute="@this #{nameFields}" render="#{nameRow} :propertyForm:basicTable"/>
                </h:selectOneRadio>
                <h:inputText id="nameNewText" value="#{bean.nameText}" size="55" maxlength="512" styleClass="TxtFld_sun4" disabled="#{bean.fromList}"/>
            </adm:property>
            <adm:property id="threadPoolsIdProp" label="#{i18njca['resourceAdapterConfig.threadPoolId']}" for="threadpoolsid"
                          helpText="#{i18njca['resourceAdapterConfig.ThreadPoolIdsHelp']}">
                <h:selectOneMenu id="threadpoolsid" value="#{bean.threadPoolIds}" styleClass="MnuStd_sun4">
                    <f:selectItems value="#{bean.threadPools}"/>
                </h:selectOneMenu>
            </adm:property>
        </adm:propertySheet>

        <adm:propertyTable id="basicTable" rows="#{bean.properties}" title="#{i18n['common.AdditionalProperties']}" descriptions="false"/>
    </h:form>
    <script>document.title = '#{i18njca['resourceAdapterConfig.newPageTitle']}';</script>
</ui:composition>

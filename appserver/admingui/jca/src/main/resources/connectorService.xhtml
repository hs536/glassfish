<!--
    Prototype (adr/0006, adr/0008, adr/0009): the connector service of a configuration as a Facelets page. It takes
    precedence over connectorService.jsf.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njca" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Strings')}"/>
    <c:set var="bean" value="#{connectorServiceView}"/>

    <h:form id="propertyForm">
        <adm:pageTitle id="propertyContentPage" title="#{i18njca['connectorService.editPageTitle']}"
                       helpText="#{i18njca['connectorService.editPageTitleHelp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="saveButton" value="#{i18n['button.Save']}" styleClass="Btn1_sun4" action="#{bean.save}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                </h:panelGroup>
            </f:facet>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <adm:propertySheet id="configNameSheet">
            <adm:property id="configName" label="#{i18n['common.ConfigurationName']}">
                <h:outputText id="config" value="#{bean.configName}"/>
            </adm:property>
        </adm:propertySheet>

        <adm:propertySheet id="propertSectionTextField">
            <adm:property id="timeout" label="#{i18njca['connectorService.shutdownTimeout']}" for="tiimeout"
                          helpText="#{i18njca['connectorService.shutdownTimeoutHelp']}">
                <h:inputText id="tiimeout" value="#{bean.shutdownTimeout}" size="20" maxlength="512" styleClass="integer TxtFld_sun4"/>
                <h:outputText id="secs" value="#{i18n['common.Seconds']}" style="padding: 8pt"/>
            </adm:property>
            <adm:property id="ClassLoadingPolicy" label="#{i18njca['connectorService.classLoadingPolicy']}" for="policy"
                          helpText="#{i18njca['connectorService.classLoadingPolicyHelp']}">
                <h:selectOneMenu id="policy" value="#{bean.classLoadingPolicy}" styleClass="MnuStd_sun4">
                    <f:selectItems value="#{bean.policies}"/>
                </h:selectOneMenu>
            </adm:property>
        </adm:propertySheet>
            <input id="helpKey" type="hidden" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Helplinks')['connectorService']}"/>
    </h:form>
    <script>document.title = '#{i18njca['connectorService.editPageTitle']}';</script>
</ui:composition>

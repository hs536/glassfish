<!--
    Prototype (adr/0006, adr/0008, adr/0009): the Security Maps tab of a connector connection pool as a Facelets page. It
    takes precedence over connectorSecurityMaps.jsf.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njca" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Strings')}"/>
    <c:set var="bean" value="#{connectorSecurityMapsView}"/>

    <h:form id="propertyForm">
        <adm:tabSet id="connectorPoolSet" rendered="#{bean.found}">
            <adm:tab label="#{i18n['common.General']}" url="#{bean.generalPage}"/>
            <adm:tab label="#{i18n['common.Advanced']}" url="#{bean.advancedPage}"/>
            <adm:tab label="#{i18n['common.AdditonalProperties']}" url="#{bean.propertiesPage}"/>
            <adm:tab label="#{i18njca['connectorSecurityMaps.tabTitle']}" selected="true"/>
        </adm:tabSet>

        <adm:pageTitle id="propertyContentPage" title="#{i18njca['connectorSecurityMaps.pageTitle']}"
                       helpText="#{i18njca['connectorSecurityMaps.pageTitleHelp']}"/>
        <br/><br/>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <ui:fragment rendered="#{bean.found}">
            <adm:propertySheet id="resourceNameSheet">
                <adm:property id="resourceNameProp" label="#{i18n['common.poolName']}">
                    <h:outputText id="resourceName" value="#{bean.name}"/>
                </adm:property>
            </adm:propertySheet>

            <adm:table id="resourcesTable" title="#{i18njca['connectorSecurityMaps.tableTitle']}" count="#{bean.rows.size()}" columns="2">
                <f:facet name="actions">
                    <adm:resourceTableActions id="actions" bean="#{bean}" newPage="#{bean.newPage}" enableActions="false"
                                              deleteConfirmation="#{i18njca['msg.JS.confirmDeleteSM']}"/>
                </f:facet>
                <f:facet name="header">
                    <h:panelGroup>
                        <adm:sortHeader text="#{i18n['common.SelectHeader']}" width="3%"/>
                        <adm:sortHeader id="nameHeader" text="#{i18n['common.name.header']}" key="name" sorter="#{bean}"/>
                    </h:panelGroup>
                </f:facet>
                <ui:repeat id="rows" value="#{bean.rows}" var="row">
                    <tr>
                        <td class="TblTdSel_sun4" align="left">
                            <span class="CbSpn_sun4">
                                <h:selectBooleanCheckbox id="select" value="#{row.selected}" title="#{i18n['common.select']}">
                                    <f:ajax render=":propertyForm:resourcesTable:actions"/>
                                </h:selectBooleanCheckbox>
                            </span>
                        </td>
                        <th class="TblTdLyt_sun4" align="left" scope="row">
                            <h:outputLink id="link" value="#{bean.editPage(row.name)}">#{row.name}</h:outputLink>
                        </th>
                    </tr>
                </ui:repeat>
            </adm:table>
        </ui:fragment>
    </h:form>
    <script>document.title = '#{i18njca['connectorSecurityMaps.pageTitle']}';</script>
</ui:composition>

<!--
    Prototype (adr/0006, adr/0008): the edit connector resource page as a Facelets page. It takes precedence over
    connectorResourceEdit.jsf. The Target tab opens the JSFTemplating page common/resourceNode/resourceEditTargets.jsf.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njca" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Strings')}"/>
    <c:set var="bean" value="#{connectorResourceEditView}"/>

    <h:form id="propertyForm">
        <adm:tabSet id="resEditTabs" rendered="#{bean.found and not bean.onlyServer}">
            <adm:tab label="#{i18n['common.General']}" selected="true"/>
            <adm:tab label="#{i18n['common.TargetTab']}" url="#{bean.targetPage}"/>
        </adm:tabSet>

        <adm:pageTitle id="propertyContentPage" title="#{i18njca['connectorResource.editPageTitle']}"
                       helpText="#{i18njca['connectorResource.editPageTitleHelp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="saveButton" value="#{i18n['button.Save']}" styleClass="Btn1_sun4" rendered="#{bean.found}" action="#{bean.save}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <input id="propertyForm:cancelButton" type="button" class="Btn2_sun4" value="#{i18n['button.Cancel']}"
                           onclick="admingui.ajax.loadPage({url: '#{request.contextPath}/jca/connectorResources.jsf'}); return false;"/>
                </h:panelGroup>
            </f:facet>
            <h:commandButton id="loadDefaultsButton" value="#{i18n['button.LoadDefaults']}" styleClass="Btn2_sun4" style="margin-left: 8pt"
                             rendered="#{bean.found}" action="#{bean.loadDefaults}">
                <f:ajax execute="@form" render="@form"/>
            </h:commandButton>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <adm:propertySheet id="propertySheet" rendered="#{bean.found}">
            <adm:property id="jndiStaticProp" label="#{i18n['common.jndiName']}">
                <h:outputText id="Jndi" value="#{bean.name}"/>
            </adm:property>
            <adm:property id="poolNameProp" label="#{i18n['common.poolName']}" for="PoolName" required="true"
                          helpText="#{bean.poolHelp}" helpTextEscape="false">
                <h:selectOneMenu id="PoolName" value="#{bean.values['poolName']}" styleClass="required MnuStd_sun4" required="true"
                                 requiredMessage="#{i18n['msg.JS.enterValue']} #{i18n['common.poolName']}">
                    <f:selectItems value="#{bean.pools}"/>
                </h:selectOneMenu>
            </adm:property>
            <adm:property id="deploymentOrderProp" label="#{i18n['common.resource.deploymentOrder']}" for="deploymentOrder"
                          helpText="#{i18n['common.resource.deploymentOrderHelp']}">
                <h:inputText id="deploymentOrder" value="#{bean.values['deploymentOrder']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
            </adm:property>
            <adm:property id="descProp" label="#{i18n['common.description']}" for="desc">
                <h:inputText id="desc" value="#{bean.values['description']}" size="55" maxlength="512" styleClass="TxtFld_sun4"/>
            </adm:property>
            <adm:property id="statusProp" label="#{i18n['common.status']}" for="enabled" rendered="#{bean.onlyServer}">
                <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="enabled" value="#{bean.enabled}"/></span>
            </adm:property>
            <adm:property id="statusProp2" label="#{i18n['common.status']}" rendered="#{not bean.onlyServer}"
                          helpText="#{i18n['application.EnableTargetHelp']}">
                <h:outputText id="enabledStr" value="#{bean.status}"/>
            </adm:property>
        </adm:propertySheet>

        <adm:propertyTable id="basicTable" rows="#{bean.properties}" title="#{i18n['common.AdditionalProperties']}" rendered="#{bean.found}"/>
            <input id="helpKey" type="hidden" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Helplinks')['connectorResourceEdit']}"/>
    </h:form>
    <script>document.title = '#{i18njca['connectorResource.editPageTitle']}';</script>
</ui:composition>

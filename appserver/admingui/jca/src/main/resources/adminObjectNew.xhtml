<!--
    Prototype (adr/0006, adr/0008): the new admin object resource page as a Facelets page. It takes precedence over
    adminObjectNew.jsf. The target section comes from the TargetSectionForResource integration point.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njca" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Strings')}"/>
    <c:set var="bean" value="#{adminObjectNewView}"/>

    <h:form id="form">
        <adm:pageTitle id="propertyContentPage" title="#{i18njca['adminObject.NewPageTitle']}"
                       helpText="#{i18njca['adminObject.NewPageTitleHelp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="newButton" value="#{i18n['button.OK']}" styleClass="Btn1_sun4" action="#{bean.create}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <input id="form:cancelButton" type="button" class="Btn2_sun4" value="#{i18n['button.Cancel']}"
                           onclick="admingui.ajax.loadPage({url: '#{request.contextPath}/jca/adminObjectResources.jsf'}); return false;"/>
                </h:panelGroup>
            </f:facet>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <ui:include src="/jca/adminObjectAttr.xhtml">
            <ui:param name="bean" value="#{bean}"/>
            <ui:param name="edit" value="#{false}"/>
            <ui:param name="formId" value="form"/>
            <ui:param name="dependents" value=":form:basicTable"/>
        </ui:include>

        <adm:propertyTable id="basicTable" rows="#{bean.properties}" title="#{i18n['common.AdditionalProperties']}"/>

        <c:forEach items="#{consoleIntegrationPoints.faceletsViews('org.glassfish.admingui:TargetSectionForResource')}" var="targetView">
            <ui:include src="#{targetView}"/>
        </c:forEach>
            <input id="helpKey" type="hidden" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Helplinks')['adminObjectNew1']}"/>
    </h:form>
    <script>document.title = '#{i18njca['adminObject.NewPageTitle']}';</script>
</ui:composition>

<!--
    Prototype (adr/0006, adr/0008, adr/0009): an existing work security map as a Facelets page. It takes precedence over
    workSecurityMapEdit.jsf for the maps of the domain; the maps of an application (isAppScopedRes) are not handled (X-27).
    The option of the kind of mappings the map does not have is disabled.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njca" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Strings')}"/>
    <c:set var="bean" value="#{workSecurityMapEditView}"/>
    <c:set var="optionRows" value=":propertyForm:propertSectionTextField:groupProp :propertyForm:propertSectionTextField:principalsProp"/>
    <c:set var="mappingFields" value=":propertyForm:propertSectionTextField:groupProp:eisgrouptext :propertyForm:propertSectionTextField:principalsProp:eisprincipals"/>

    <h:form id="propertyForm">
        <adm:pageTitle id="propertyContentPage" title="#{i18njca['workSecurityMap.editPageTitle']}"
                       helpText="#{i18njca['workSecurityMap.editPageTitleHelp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="saveButton" value="#{i18n['button.Save']}" styleClass="Btn1_sun4" rendered="#{bean.found}" action="#{bean.save}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <input id="propertyForm:cancelButton" type="button" class="Btn2_sun4" value="#{i18n['button.Cancel']}"
                           onclick="admingui.ajax.loadPage({url: '#{bean.listPage}'}); return false;"/>
                </h:panelGroup>
            </f:facet>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <adm:propertySheet id="propertSectionTextField" rendered="#{bean.found}">
            <adm:property id="mapName" label="#{i18njca['connectorSecurityMap.securityMapName']}">
                <h:outputText id="map" value="#{bean.mapName}"/>
            </adm:property>
            <adm:property id="groupProp" label="#{i18njca['workSecurityMap.Group']}" for="eisgrouptext"
                          helpText="#{i18njca['workSecurityMap.EISGroupInlineHelp']}">
                <h:selectOneRadio id="optA" group="usersOption" value="#{bean.option}" disabled="#{bean.principalsMapped}">
                    <f:selectItem itemValue="users" itemLabel="#{i18njca['workSecurityMap.GroupMapping']}"/>
                    <f:ajax execute="@this #{mappingFields}" render="#{optionRows}"/>
                </h:selectOneRadio>
                <br/><br/>
                <h:inputText id="eisgrouptext" value="#{bean.groups}" size="55" maxlength="512" styleClass="TxtFld_sun4" disabled="#{not bean.groupsOption}"/>
            </adm:property>
            <adm:property id="principalsProp" label="#{i18njca['workSecurityMap.Principal']}" for="eisprincipals"
                          helpText="#{i18njca['workSecurityMap.EISPrincipalInlineHelp']}">
                <h:selectOneRadio id="optB" group="usersOption" value="#{bean.option}" disabled="#{bean.groupsMapped}">
                    <f:selectItem itemValue="principals" itemLabel="#{i18njca['workSecurityMap.PrincipalMapping']}"/>
                    <f:ajax execute="@this #{mappingFields}" render="#{optionRows}"/>
                </h:selectOneRadio>
                <br/><br/>
                <h:inputText id="eisprincipals" value="#{bean.principals}" size="55" maxlength="512" styleClass="TxtFld_sun4" disabled="#{bean.groupsOption}"/>
            </adm:property>
            <adm:property id="resAdaptorProp" label="#{i18n['common.resourceAdapter']}" for="resAdaptor"
                          helpText="#{i18njca['adminObjectResource.resourceAdapterHelp']}">
                <h:selectOneMenu id="resAdaptor" value="#{bean.adapter}" styleClass="MnuStd_sun4">
                    <f:selectItems value="#{bean.adapters}"/>
                </h:selectOneMenu>
            </adm:property>
            <adm:property id="deploymentOrder" label="#{i18n['common.resource.deploymentOrder']}" for="order"
                          helpText="#{i18n['common.resource.deploymentOrderHelp']}">
                <h:inputText id="order" value="#{bean.deploymentOrder}" size="10" maxlength="10" styleClass="integer TxtFld_sun4"/>
            </adm:property>
            <adm:property id="descriptionProp" label="#{i18n['common.description']}" for="descAdaptor">
                <h:inputText id="descAdaptor" value="#{bean.description}" size="55" maxlength="512" styleClass="TxtFld_sun4"/>
            </adm:property>
        </adm:propertySheet>
    </h:form>
    <script>document.title = '#{i18njca['workSecurityMap.editPageTitle']}';</script>
</ui:composition>

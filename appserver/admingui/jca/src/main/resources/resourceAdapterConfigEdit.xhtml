<!--
    Prototype (adr/0006, adr/0008, adr/0009): an existing resource adapter config as a Facelets page. It takes precedence
    over resourceAdapterConfigEdit.jsf for the configs of the domain; the configs of an application (isAppScopedRes) are
    not handled (X-27). A config whose adapter is not deployed opens without confidential values (B-39).
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njca" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Strings')}"/>
    <c:set var="bean" value="#{resourceAdapterConfigEditView}"/>

    <h:form id="propertyForm">
        <adm:pageTitle id="propertyContentPage" title="#{i18njca['resourceAdapterConfig.editPageTitle']}"
                       helpText="#{i18njca['resourceAdapterConfig.editPageTitleHelp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="saveButton" value="#{i18n['button.Save']}" styleClass="Btn1_sun4" rendered="#{bean.found}" action="#{bean.save}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <input id="propertyForm:cancelButton" type="button" class="Btn2_sun4" value="#{i18n['button.Cancel']}"
                           onclick="admingui.ajax.loadPage({url: '#{bean.listPage}'}); return false;"/>
                </h:panelGroup>
            </f:facet>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <ui:fragment rendered="#{bean.found}">
            <adm:propertySheet id="propertSectionTextField">
                <adm:property id="name" label="#{i18njca['resourceAdapterConfig.Name']}">
                    <h:outputText id="configName" value="#{bean.name}"/>
                </adm:property>
                <adm:property id="threadPoolsIdProp" label="#{i18njca['resourceAdapterConfig.threadPoolId']}" for="threadpoolsid"
                              helpText="#{i18njca['resourceAdapterConfig.ThreadPoolIdsHelp']}">
                    <h:selectOneMenu id="threadpoolsid" value="#{bean.threadPoolIds}" styleClass="MnuStd_sun4">
                        <f:selectItems value="#{bean.threadPools}"/>
                    </h:selectOneMenu>
                </adm:property>
                <adm:property id="deploymentOrder" label="#{i18n['common.resource.deploymentOrder']}" for="order"
                              helpText="#{i18n['common.resource.deploymentOrderHelp']}">
                    <h:inputText id="order" value="#{bean.deploymentOrder}" size="10" maxlength="10" styleClass="integer TxtFld_sun4"/>
                </adm:property>
            </adm:propertySheet>

            <adm:propertyTable id="basicTable" rows="#{bean.properties}" title="#{i18n['common.AdditionalProperties']}" descriptions="false"/>
        </ui:fragment>
            <input id="helpKey" type="hidden" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Helplinks')['resourceAdapterConfigEdit']}"/>
    </h:form>
    <script>document.title = '#{i18njca['resourceAdapterConfig.editPageTitle']}';</script>
</ui:composition>

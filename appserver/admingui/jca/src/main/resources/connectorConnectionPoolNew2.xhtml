<!--
    Prototype (adr/0006, adr/0008): the second page of the new connector connection pool wizard as a Facelets page. It
    takes precedence over connectorConnectionPoolNew2.jsf. The properties table has no description column, as on the
    JSFTemplating page.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njca" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Strings')}"/>
    <c:set var="bean" value="#{connectorConnectionPoolNew2View}"/>
    <c:set var="wizard" value="#{bean.wizard}"/>

    <h:form id="propertyForm">
        <adm:pageTitle id="propertyContentPage" title="#{i18njca['connectorConnectionPool.step2PageTitle']}"
                       helpText="#{i18njca['connectorConnectionPool.step2PageTitleHelp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="previousButton" value="#{i18n['button.Previous']}" styleClass="Btn2_sun4" action="#{bean.previous}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <h:commandButton id="finishButton" value="#{i18n['button.Finish']}" styleClass="Btn1_sun4" action="#{bean.finish}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <h:commandButton id="cancelButton" value="#{i18n['button.Cancel']}" styleClass="Btn2_sun4" action="#{bean.cancel}">
                        <f:ajax execute="@this"/>
                    </h:commandButton>
                </h:panelGroup>
            </f:facet>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <adm:propertySheet id="generalPropertySheet" legend="#{i18n['common.GeneralSettings']}">
            <adm:property id="jndiProp" label="#{i18njca['poolName']}">
                <h:outputText id="Jndi" value="#{wizard.name}"/>
            </adm:property>
            <adm:property id="resAdapterNewProp" label="#{i18n['common.resourceAdapter']}">
                <h:outputText id="resAdapter" value="#{wizard.adapter}"/>
            </adm:property>
            <adm:property id="connectionDefNewProp" label="#{i18njca['connectorConnectionPool.connectionDefinitionName']}">
                <h:outputText id="connectionDef" value="#{wizard.definition}"/>
            </adm:property>
            <adm:property id="pingProp" label="#{i18njca['jcaPool.ping']}" for="ping" helpText="#{i18njca['jcaPool.pingHelp']}">
                <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="ping" value="#{wizard.flags['ping']}"/></span>
            </adm:property>
            <adm:property id="descProp" label="#{i18n['common.description']}" for="desc">
                <h:inputText id="desc" value="#{wizard.values['description']}" size="60" maxlength="512" styleClass="TxtFld_sun4"/>
            </adm:property>
        </adm:propertySheet>

        <adm:propertySheet id="poolSettingsPropertySheet" legend="#{i18njca['jcaPool.poolSettings']}">
            <adm:property id="initSizeProp" label="#{i18njca['jcaPool.initPoolSize']}" for="steadyPoolSize" helpText="#{i18njca['jcaPool.initPoolSizeHelp']}">
                <h:inputText id="steadyPoolSize" value="#{wizard.values['steadyPoolSize']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                <h:outputText value="#{i18n['common.Connections']}" style="padding: 8pt"/>
            </adm:property>
            <adm:property id="maxProp" label="#{i18njca['jcaPool.maxPoolSize']}" for="maxPoolSize" helpText="#{i18njca['jcaPool.maxPoolSizeHelp']}">
                <h:inputText id="maxPoolSize" value="#{wizard.values['maxPoolSize']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                <h:outputText value="#{i18n['common.Connections']}" style="padding: 8pt"/>
            </adm:property>
            <adm:property id="resizeProp" label="#{i18njca['jcaPool.poolResize']}" for="poolResizeQuantity" helpText="#{i18njca['jcaPool.poolResizeHelp']}">
                <h:inputText id="poolResizeQuantity" value="#{wizard.values['poolResizeQuantity']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                <h:outputText value="#{i18n['common.Connections']}" style="padding: 8pt"/>
            </adm:property>
            <adm:property id="idleProp" label="#{i18njca['jcaPool.idleTimeout']}" for="idleTimeout" helpText="#{i18njca['jcaPool.idleTimeoutHelp']}">
                <h:inputText id="idleTimeout" value="#{wizard.values['idleTimeoutInSeconds']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                <h:outputText value="#{i18n['common.Seconds']}" style="padding: 8pt"/>
            </adm:property>
            <adm:property id="maxWaitProp" label="#{i18njca['jcaPool.maxWait']}" for="maxWait" helpText="#{i18njca['jcaPool.maxWaitHelp']}">
                <h:inputText id="maxWait" value="#{wizard.values['maxWaitTimeInMillis']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                <h:outputText value="#{i18n['common.Milliseconds']}" style="padding: 8pt"/>
            </adm:property>
        </adm:propertySheet>

        <adm:propertySheet id="poolPropertySheet" legend="#{i18njca['jcaPool.Validation']}">
            <adm:property id="conValidationProp" label="#{i18njca['jcaPool.conValidation']}" for="conValidation"
                          helpText="#{i18njca['connectorConnectionPool.conValidationHelp']}">
                <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="conValidation" value="#{wizard.flags['isConnectionValidationRequired']}"/></span>
                <h:outputLabel for="conValidation" value="#{i18n['common.Required']}"/>
            </adm:property>
            <adm:property id="failProp" label="#{i18njca['connectorConnectionPool.onFail']}" for="failAll"
                          helpText="#{i18njca['connectorConnectionPool.onFailHelp']}">
                <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="failAll" value="#{wizard.flags['failAllConnections']}"/></span>
                <h:outputLabel for="failAll" value="#{i18njca['connectorConnectionPool.closeAll']}"/>
            </adm:property>
            <adm:property id="transprop" label="#{i18njca['connectorConnectionPool.transSupport']}" for="trans"
                          helpText="#{i18njca['connectorConnectionPool.transSupportHelp']}">
                <h:selectOneMenu id="trans" value="#{wizard.values['transactionSupport']}" styleClass="MnuStd_sun4">
                    <f:selectItems value="#{wizard.transactionSupports}"/>
                </h:selectOneMenu>
            </adm:property>
        </adm:propertySheet>

        <adm:propertyTable id="basicTable" rows="#{wizard.properties}" title="#{i18n['common.AdditionalProperties']}" descriptions="false"/>
            <input id="helpKey" type="hidden" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Helplinks')['connectorConnectionPoolNew2']}"/>
    </h:form>
    <script>document.title = '#{i18njca['connectorConnectionPool.step2PageTitle']}';</script>
</ui:composition>

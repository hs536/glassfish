<!--
    Prototype (adr/0006, adr/0008): the new connector resource page as a Facelets page. It takes precedence over
    connectorResourceNew.jsf. The target section comes from the TargetSectionForResource integration point.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njca" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Strings')}"/>
    <c:set var="bean" value="#{connectorResourceNewView}"/>

    <h:form id="form">
        <adm:pageTitle id="propertyContentPage" title="#{i18njca['connectorResource.newPageTitle']}"
                       helpText="#{i18njca['connectorResource.newPageTitleHelp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="newButton" value="#{i18n['button.OK']}" styleClass="Btn1_sun4" action="#{bean.create}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <input id="form:cancelButton" type="button" class="Btn2_sun4" value="#{i18n['button.Cancel']}"
                           onclick="admingui.ajax.loadPage({url: '#{request.contextPath}/jca/connectorResources.jsf'}); return false;"/>
                </h:panelGroup>
            </f:facet>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <adm:propertySheet id="propertySheet">
            <adm:property id="jndiTextProp" label="#{i18n['common.jndiName']}" for="jnditext" required="true">
                <h:inputText id="jnditext" value="#{bean.values['name']}" size="30" maxlength="512" styleClass="required TxtFld_sun4"
                             required="true" requiredMessage="#{i18n['msg.JS.enterValue']} #{i18n['common.jndiName']}"
                             validator="#{bean.validateName}"/>
            </adm:property>
            <adm:property id="poolNameProp" label="#{i18n['common.poolName']}" for="PoolName" required="true"
                          helpText="#{bean.poolHelp}" helpTextEscape="false">
                <h:selectOneMenu id="PoolName" value="#{bean.values['poolName']}" styleClass="required MnuStd_sun4" required="true"
                                 requiredMessage="#{i18n['msg.JS.enterValue']} #{i18n['common.poolName']}">
                    <f:selectItems value="#{bean.pools}"/>
                </h:selectOneMenu>
            </adm:property>
            <adm:property id="descProp" label="#{i18n['common.description']}" for="desc">
                <h:inputText id="desc" value="#{bean.values['description']}" size="55" maxlength="512" styleClass="TxtFld_sun4"/>
            </adm:property>
            <adm:property id="statusProp" label="#{i18n['common.status']}" for="enabled">
                <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="enabled" value="#{bean.enabled}"/></span>
            </adm:property>
        </adm:propertySheet>

        <adm:propertyTable id="basicTable" rows="#{bean.properties}" title="#{i18n['common.AdditionalProperties']}"/>

        <c:forEach items="#{consoleIntegrationPoints.faceletsViews('org.glassfish.admingui:TargetSectionForResource')}" var="targetView">
            <ui:include src="#{targetView}"/>
        </c:forEach>
    </h:form>
    <script>document.title = '#{i18njca['connectorResource.newPageTitle']}';</script>
</ui:composition>

<!--
    Prototype (adr/0008): the attributes of an admin object resource, shared by the new and edit pages (the Facelets
    counterpart of jca/adminObjectAttr.inc). Changing the resource adapter or the resource type renders the dependent
    rows again with Ajax, where the JSFTemplating page submitted the form and opened the page again.
    Parameters: bean (AdminObjectNewView or AdminObjectEditView), edit (true on the edit page), formId (the id of the
    enclosing form), dependents (the client ids rendered again besides the type and class name rows, such as the
    additional properties table of the new page; may be empty).
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njca" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Strings')}"/>
    <c:set var="classNameRow" value=":#{formId}:propertySheet:classNameProp #{dependents}"/>
    <c:set var="typeRows" value=":#{formId}:propertySheet:resTypeProp #{classNameRow}"/>

    <adm:propertySheet id="propertySheet">
        <adm:property id="nameProp" label="#{i18n['common.jndiName']}" rendered="#{edit}">
            <h:outputText id="name" value="#{bean.name}"/>
        </adm:property>
        <adm:property id="nameNewProp" label="#{i18n['common.jndiName']}" for="nameNew" required="true" rendered="#{not edit}">
            <h:inputText id="nameNew" value="#{bean.values['name']}" size="30" maxlength="512" styleClass="required TxtFld_sun4"
                         required="#{not edit}" requiredMessage="#{i18n['msg.JS.enterValue']} #{i18n['common.jndiName']}"
                         validator="#{bean.validateName}"/>
        </adm:property>
        <adm:property id="resAdaptorProp" label="#{i18n['common.resourceAdapter']}" for="resAdapter" required="true"
                      helpText="#{i18njca['adminObjectResource.resourceAdapterHelp']}">
            <h:selectOneMenu id="resAdapter" value="#{bean.values['resAdapter']}" styleClass="required MnuStd_sun4" required="true"
                             requiredMessage="#{i18n['msg.JS.enterValue']} #{i18n['common.resourceAdapter']}">
                <f:selectItems value="#{bean.choices.adapters}"/>
                <f:ajax execute="@this" listener="#{bean.adapterChanged}" render="#{typeRows}"/>
            </h:selectOneMenu>
        </adm:property>
        <adm:property id="resTypeProp" label="#{i18n['common.resType']}" for="resType" required="true"
                      helpText="#{i18njca['adminObjectResource.resTypeHelp']}">
            <h:selectOneMenu id="resType" value="#{bean.values['resType']}" styleClass="required MnuStd_sun4" required="true"
                             requiredMessage="#{i18n['msg.JS.enterValue']} #{i18n['common.resType']}">
                <f:selectItems value="#{bean.choices.types}"/>
                <f:ajax execute="@this" listener="#{bean.typeChanged}" render="#{classNameRow}"/>
            </h:selectOneMenu>
        </adm:property>
        <adm:property id="classNameProp" label="#{i18njca['adminObjectResource.classname']}" for="className" required="true"
                      helpText="#{i18njca['adminObjectResource.classnameHelp']}">
            <h:selectOneMenu id="className" value="#{bean.values['className']}" styleClass="required MnuStd_sun4" required="true"
                             requiredMessage="#{i18n['msg.JS.enterValue']} #{i18njca['adminObjectResource.classname']}">
                <f:selectItems value="#{bean.choices.classNames}"/>
            </h:selectOneMenu>
        </adm:property>
        <adm:property id="deploymentOrderProp" label="#{i18n['common.resource.deploymentOrder']}" for="deploymentOrder" rendered="#{edit}"
                      helpText="#{i18n['common.resource.deploymentOrderHelp']}">
            <h:inputText id="deploymentOrder" value="#{bean.values['deploymentOrder']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
        </adm:property>
        <adm:property id="descriptionProp" label="#{i18n['common.description']}" for="descAdaptor">
            <h:inputText id="descAdaptor" value="#{bean.values['description']}" size="55" maxlength="512" styleClass="TxtFld_sun4"/>
        </adm:property>
        <adm:property id="statusProp" label="#{i18n['common.status']}" for="enabled" rendered="#{not edit or bean.onlyServer}">
            <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="enabled" value="#{bean.enabled}"/></span>
        </adm:property>
        <adm:property id="statusProp2" label="#{i18n['common.status']}" rendered="#{edit and not bean.onlyServer}"
                      helpText="#{i18n['application.EnableTargetHelp']}">
            <h:outputText id="enabledStr" value="#{bean.status}"/>
        </adm:property>
    </adm:propertySheet>
</ui:composition>

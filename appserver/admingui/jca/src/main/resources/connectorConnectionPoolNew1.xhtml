<!--
    Prototype (adr/0006, adr/0008): the first page of the new connector connection pool wizard as a Facelets page. It
    takes precedence over connectorConnectionPoolNew1.jsf. Choosing a resource adapter renders its connection definitions
    again, where the JSFTemplating page submitted the form and rendered the whole page.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njca" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Strings')}"/>
    <c:set var="bean" value="#{connectorConnectionPoolNew1View}"/>
    <c:set var="wizard" value="#{bean.wizard}"/>

    <h:form id="propertyForm">
        <adm:pageTitle id="title" title="#{i18njca['connectorConnectionPool.step1PageTitle']}"
                       helpText="#{i18njca['connectorConnectionPool.step1PageTitleHelp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="nextButton" value="#{i18n['button.Next']}" styleClass="Btn1_sun4" action="#{bean.next}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <h:commandButton id="cancelButton" value="#{i18n['button.Cancel']}" styleClass="Btn2_sun4" action="#{bean.cancel}">
                        <f:ajax execute="@this"/>
                    </h:commandButton>
                </h:panelGroup>
            </f:facet>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <adm:propertySheet id="generalPropertySheet">
            <adm:property id="jndiProp" label="#{i18njca['poolName']}" for="name" required="true">
                <h:inputText id="name" value="#{wizard.name}" size="50" maxlength="512" styleClass="TxtFld_sun4" required="true"
                             requiredMessage="#{i18n['msg.JS.enterValue']} #{i18njca['poolName']}" validator="#{bean.validateName}"/>
            </adm:property>
            <adm:property id="resAdapterProp" label="#{i18n['common.resourceAdapter']}" for="db" required="true"
                          helpText="#{i18njca['adminObjectResource.resourceAdapterHelp']}">
                <h:selectOneMenu id="db" value="#{wizard.adapter}" styleClass="MnuStd_sun4" required="true"
                                 requiredMessage="#{i18n['msg.JS.enterValue']} #{i18n['common.resourceAdapter']}">
                    <f:selectItems value="#{wizard.adapters}"/>
                    <f:ajax execute="@this" listener="#{bean.adapterChanged}" render=":propertyForm:generalPropertySheet:connectionDefProp :propertyForm:messages"/>
                </h:selectOneMenu>
            </adm:property>
            <adm:property id="connectionDefProp" label="#{i18njca['connectorConnectionPool.connectionDefinitionName']}" for="db" required="true"
                          helpText="#{i18njca['connectorConnectionPool.connectionDefinitionNameHelp']}">
                <h:selectOneMenu id="db" value="#{wizard.definition}" styleClass="MnuStd_sun4" required="true"
                                 requiredMessage="#{i18n['msg.JS.enterValue']} #{i18njca['connectorConnectionPool.connectionDefinitionName']}">
                    <f:selectItems value="#{wizard.definitions}"/>
                </h:selectOneMenu>
            </adm:property>
        </adm:propertySheet>
            <input id="helpKey" type="hidden" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Helplinks')['connectorConnectionPoolNew1']}"/>
    </h:form>
    <script>document.title = '#{i18njca['connectorConnectionPool.step1PageTitle']}';</script>
</ui:composition>

<!--
    Prototype (adr/0006, adr/0008): the General tab of a connector connection pool as a Facelets page. It takes precedence
    over connectorConnectionPoolEdit.jsf. The Advanced, Additional Properties and Security Maps tabs open the
    JSFTemplating pages. Choosing a resource adapter renders its connection definitions again, where the JSFTemplating
    page submitted the form and rendered the page again from the saved values.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njca" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Strings')}"/>
    <c:set var="bean" value="#{connectorConnectionPoolEditView}"/>

    <h:form id="propertyForm">
        <adm:tabSet id="connectorPoolSet" rendered="#{bean.found}">
            <adm:tab label="#{i18n['common.General']}" selected="true"/>
            <adm:tab label="#{i18n['common.Advanced']}" url="#{bean.advancedPage}"/>
            <adm:tab label="#{i18n['common.AdditonalProperties']}" url="#{bean.propertiesPage}"/>
            <adm:tab label="#{i18njca['connectorSecurityMaps.tabTitle']}" url="#{bean.securityMapsPage}"/>
        </adm:tabSet>

        <adm:pageTitle id="propertyContentPage" title="#{i18njca['connectorConnectionPool.editPageTitle']}"
                       helpText="#{i18njca['connectorConnectionPool.editPageTitleHelp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="saveButton" value="#{i18n['button.Save']}" styleClass="Btn1_sun4" rendered="#{bean.found}" action="#{bean.save}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <input id="propertyForm:cancelButton" type="button" class="Btn2_sun4" value="#{i18n['button.Cancel']}"
                           onclick="admingui.ajax.loadPage({url: '#{request.contextPath}/jca/connectorConnectionPools.jsf'}); return false;"/>
                </h:panelGroup>
            </f:facet>
            <h:panelGroup rendered="#{bean.found}">
                <h:commandButton id="loadDefaultsButton" value="#{i18n['button.LoadDefaults']}" styleClass="Btn2_sun4" style="margin-left: 8pt"
                                 action="#{bean.loadDefaults}">
                    <f:ajax execute="@form" render="@form"/>
                </h:commandButton>
                <h:commandButton id="flush" value="#{i18njca['button.Flush']}" styleClass="Btn2_sun4" action="#{bean.flush}">
                    <f:ajax execute="@this" render="@form"/>
                </h:commandButton>
                <h:commandButton id="ping" value="#{i18n['button.Ping']}" styleClass="Btn2_sun4" action="#{bean.ping}">
                    <f:ajax execute="@this" render="@form"/>
                </h:commandButton>
            </h:panelGroup>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <ui:fragment rendered="#{bean.found}">
            <adm:propertySheet id="generalPropertySheet" legend="#{i18n['common.GeneralSettings']}">
                <adm:property id="name" label="#{i18njca['poolName']}">
                    <h:outputText id="poolName" value="#{bean.name}"/>
                </adm:property>
                <adm:property id="resAdapterProp" label="#{i18n['common.resourceAdapter']}" for="db">
                    <h:selectOneMenu id="db" value="#{bean.values['resourceAdapterName']}" styleClass="MnuStd_sun4">
                        <f:selectItems value="#{bean.adapters}"/>
                        <f:ajax execute="@this" listener="#{bean.adapterChanged}"
                                render=":propertyForm:generalPropertySheet:connectionDefProp :propertyForm:messages"/>
                    </h:selectOneMenu>
                </adm:property>
                <adm:property id="connectionDefProp" label="#{i18njca['connectorConnectionPool.connectionDefinitionName']}" for="connectionDef">
                    <h:selectOneMenu id="connectionDef" value="#{bean.values['connectionDefinitionName']}" styleClass="MnuStd_sun4">
                        <f:selectItems value="#{bean.connectionDefinitions}"/>
                    </h:selectOneMenu>
                </adm:property>
                <adm:property id="pingProp" label="#{i18njca['jcaPool.ping']}" for="ping" helpText="#{i18njca['jcaPool.pingHelp']}">
                    <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="ping" value="#{bean.flags['ping']}"/></span>
                </adm:property>
                <adm:property id="deploymentOrder" label="#{i18n['common.resource.deploymentOrder']}" for="order"
                              helpText="#{i18n['common.resource.deploymentOrderHelp']}">
                    <h:inputText id="order" value="#{bean.values['deploymentOrder']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                </adm:property>
                <adm:property id="descProp" label="#{i18n['common.description']}" for="desc">
                    <h:inputText id="desc" value="#{bean.values['description']}" size="60" maxlength="512" styleClass="TxtFld_sun4"/>
                </adm:property>
            </adm:propertySheet>

            <adm:propertySheet id="poolSettingsPropertySheet" legend="#{i18njca['jcaPool.poolSettings']}">
                <adm:property id="initSizeProp" label="#{i18njca['jcaPool.initPoolSize']}" for="steadyPoolSize" helpText="#{i18njca['jcaPool.initPoolSizeHelp']}">
                    <h:inputText id="steadyPoolSize" value="#{bean.values['steadyPoolSize']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                    <h:outputText value="#{i18n['common.Connections']}" style="padding: 8pt"/>
                </adm:property>
                <adm:property id="maxProp" label="#{i18njca['jcaPool.maxPoolSize']}" for="maxPoolSize" helpText="#{i18njca['jcaPool.maxPoolSizeHelp']}">
                    <h:inputText id="maxPoolSize" value="#{bean.values['maxPoolSize']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                    <h:outputText value="#{i18n['common.Connections']}" style="padding: 8pt"/>
                </adm:property>
                <adm:property id="resizeProp" label="#{i18njca['jcaPool.poolResize']}" for="poolResizeQuantity" helpText="#{i18njca['jcaPool.poolResizeHelp']}">
                    <h:inputText id="poolResizeQuantity" value="#{bean.values['poolResizeQuantity']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                    <h:outputText value="#{i18n['common.Connections']}" style="padding: 8pt"/>
                </adm:property>
                <adm:property id="idleProp" label="#{i18njca['jcaPool.idleTimeout']}" for="idleTimeout" helpText="#{i18njca['jcaPool.idleTimeoutHelp']}">
                    <h:inputText id="idleTimeout" value="#{bean.values['idleTimeoutInSeconds']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                    <h:outputText value="#{i18n['common.Seconds']}" style="padding: 8pt"/>
                </adm:property>
                <adm:property id="maxWaitProp" label="#{i18njca['jcaPool.maxWait']}" for="maxWait" helpText="#{i18njca['jcaPool.maxWaitHelp']}">
                    <h:inputText id="maxWait" value="#{bean.values['maxWaitTimeInMillis']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
                    <h:outputText value="#{i18n['common.Milliseconds']}" style="padding: 8pt"/>
                </adm:property>
            </adm:propertySheet>

            <adm:propertySheet id="poolPropertySheet" legend="#{i18njca['jcaPool.Validation']}">
                <adm:property id="conValidationProp" label="#{i18njca['jcaPool.conValidation']}" for="conValidation"
                              helpText="#{i18njca['connectorConnectionPool.conValidationHelp']}">
                    <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="conValidation" value="#{bean.flags['isConnectionValidationRequired']}"/></span>
                    <h:outputLabel for="conValidation" value="#{i18n['common.Required']}"/>
                </adm:property>
                <adm:property id="failProp" label="#{i18njca['connectorConnectionPool.onFail']}" for="failAll"
                              helpText="#{i18njca['connectorConnectionPool.onFailHelp']}">
                    <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="failAll" value="#{bean.flags['failAllConnections']}"/></span>
                    <h:outputLabel for="failAll" value="#{i18njca['connectorConnectionPool.closeAll']}"/>
                </adm:property>
                <adm:property id="transprop" label="#{i18njca['connectorConnectionPool.transSupport']}" for="trans"
                              helpText="#{i18njca['connectorConnectionPool.transSupportHelp']}">
                    <h:selectOneMenu id="trans" value="#{bean.values['transactionSupport']}" styleClass="MnuStd_sun4">
                        <f:selectItems value="#{bean.transactionSupports}"/>
                    </h:selectOneMenu>
                </adm:property>
            </adm:propertySheet>
        </ui:fragment>
            <input id="helpKey" type="hidden" value="#{consoleBundles.get('jca', 'org.glassfish.jca.admingui.Helplinks')['connectorConnectionPoolEdit']}"/>
    </h:form>
    <script>document.title = '#{i18njca['connectorConnectionPool.editPageTitle']}';</script>
</ui:composition>

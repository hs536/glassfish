<!--
    Prototype (adr/0008): the attributes of a JMS destination resource, shared by its new and edit pages (the Facelets
    counterpart of jms/jmsDestinationSheet.inc). Parameters: bean (JmsDestinationNewView or JmsDestinationEditView), edit
    (true on the edit page).
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njms" value="#{consoleBundles.get('jms', 'org.glassfish.jms.admingui.Strings')}"/>

    <adm:propertySheet id="propertySheet">
        <adm:property id="jndiProp" label="#{i18n['common.jndiName']}" for="jndi" required="true" rendered="#{not edit}">
            <h:inputText id="jndi" value="#{bean.values['name']}" size="55" maxlength="512" styleClass="required TxtFld_sun4"
                         required="#{not edit}" requiredMessage="#{i18n['msg.JS.enterValue']} #{i18n['common.jndiName']}"
                         validator="#{bean.validateName}"/>
        </adm:property>
        <adm:property id="jndiNameProp" label="#{i18n['common.jndiName']}" rendered="#{edit}">
            <h:outputText id="jndiName" value="#{bean.name}"/>
        </adm:property>
        <adm:property id="nameProp" label="#{i18njms['jmsDestination.destName']}" for="physicalName" required="true"
                      helpText="#{i18njms['jmsDestination.destNameHelp']}">
            <h:inputText id="physicalName" value="#{bean.physicalName}" size="55" maxlength="512" styleClass="required TxtFld_sun4"
                         required="true" requiredMessage="#{i18n['msg.JS.enterValue']} #{i18njms['jmsDestination.destName']}"/>
        </adm:property>
        <adm:property id="resTypeProp" label="#{i18n['common.resType']}" for="resType" required="true">
            <h:selectOneMenu id="resType" value="#{bean.values['resType']}" styleClass="required MnuStd_sun4" required="true"
                             requiredMessage="#{i18n['msg.JS.enterValue']} #{i18n['common.resType']}">
                <f:selectItems value="#{bean.types}"/>
            </h:selectOneMenu>
        </adm:property>
        <adm:property id="deploymentOrderProp" label="#{i18n['common.resource.deploymentOrder']}" for="deploymentOrder" rendered="#{edit}"
                      helpText="#{i18n['common.resource.deploymentOrderHelp']}">
            <h:inputText id="deploymentOrder" value="#{bean.values['deploymentOrder']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
        </adm:property>
        <adm:property id="descProp" label="#{i18n['common.description']}" for="desc">
            <h:inputText id="desc" value="#{bean.values['description']}" size="55" maxlength="512" styleClass="TxtFld_sun4"/>
        </adm:property>
        <adm:property id="statusProp" label="#{i18n['common.status']}" for="enabled" rendered="#{not edit or bean.onlyServer}">
            <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="enabled" value="#{bean.enabled}"/></span>
        </adm:property>
        <adm:property id="statusProp2" label="#{i18n['common.status']}" rendered="#{edit and not bean.onlyServer}"
                      helpText="#{i18n['application.EnableTargetHelp']}">
            <h:outputText id="enabledStr" value="#{bean.status}"/>
        </adm:property>
    </adm:propertySheet>
</ui:composition>

<!--
    Prototype (adr/0008): the attributes of a JMS connection factory, shared by its new and edit pages (the Facelets
    counterpart of jms/poolProperties.inc). Parameters: bean (JmsConnectionFactoryNewView or
    JmsConnectionFactoryEditView), edit (true on the edit page), pool (the attribute values of the connector connection
    pool).
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njms" value="#{consoleBundles.get('jms', 'org.glassfish.jms.admingui.Strings')}"/>

    <adm:propertySheet id="propertySheet" legend="#{i18n['common.GeneralSettings']}">
        <adm:property id="jndiProp" label="#{i18n['common.jndiName']}" for="jndi" required="true" rendered="#{not edit}">
            <h:inputText id="jndi" value="#{bean.values['name']}" size="55" maxlength="512" styleClass="required TxtFld_sun4"
                         required="#{not edit}" requiredMessage="#{i18n['msg.JS.enterValue']} #{i18n['common.jndiName']}"
                         validator="#{bean.validateName}"/>
        </adm:property>
        <adm:property id="jndiProp2" label="#{i18n['common.jndiName']}" rendered="#{edit}">
            <h:outputText id="jndiName" value="#{bean.name}"/>
        </adm:property>
        <adm:property id="logic" label="#{i18n['common.logicalJndiName']}" rendered="#{edit and not empty bean.logicalJndiName}">
            <h:outputText id="logicalName" value="#{bean.logicalJndiName}"/>
        </adm:property>
        <adm:property id="resTyped" label="#{i18n['common.resType']}" for="#{edit ? '' : 'resType'}">
            <h:selectOneMenu id="resType" value="#{pool['connectionDefinitionName']}" styleClass="MnuStd_sun4" rendered="#{not edit}">
                <f:selectItems value="#{bean.types}"/>
            </h:selectOneMenu>
            <h:outputText id="resTypeText" value="#{pool['connectionDefinitionName']}" rendered="#{edit}"/>
        </adm:property>
        <adm:property id="descProp" label="#{i18n['common.description']}" for="desc">
            <h:inputText id="desc" value="#{pool['description']}" size="55" maxlength="512" styleClass="TxtFld_sun4"/>
        </adm:property>
        <adm:property id="statusProp" label="#{i18n['common.status']}" for="enabled" rendered="#{not edit or bean.onlyServer}">
            <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="enabled" value="#{bean.enabled}"/></span>
        </adm:property>
        <adm:property id="statusProp2" label="#{i18n['common.status']}" rendered="#{edit and not bean.onlyServer}"
                      helpText="#{i18n['application.EnableTargetHelp']}">
            <h:outputText id="enabledStr" value="#{bean.status}"/>
        </adm:property>
    </adm:propertySheet>

    <adm:propertySheet id="poolPropertySheet" legend="#{i18njms['connectionFactory.poolSettings']}">
        <adm:property id="initSizeProp" label="#{i18njms['connectionFactory.initPoolSize']}" for="steadyPoolSize"
                      helpText="#{i18njms['connectionFactory.initPoolSizeHelp']}">
            <h:inputText id="steadyPoolSize" value="#{pool['steadyPoolSize']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
            <h:outputText value="#{i18n['common.Connections']}" style="padding: 8pt"/>
        </adm:property>
        <adm:property id="maxProp" label="#{i18njms['connectionFactory.maxPoolSize']}" for="maxPoolSize"
                      helpText="#{i18njms['connectionFactory.maxPoolSizeHelp']}">
            <h:inputText id="maxPoolSize" value="#{pool['maxPoolSize']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
            <h:outputText value="#{i18n['common.Connections']}" style="padding: 8pt"/>
        </adm:property>
        <adm:property id="resizeProp" label="#{i18njms['connectionFactory.poolResize']}" for="poolResizeQuantity"
                      helpText="#{i18njms['connectionFactory.poolResizeHelp']}">
            <h:inputText id="poolResizeQuantity" value="#{pool['poolResizeQuantity']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
            <h:outputText value="#{i18n['common.Connections']}" style="padding: 8pt"/>
        </adm:property>
        <adm:property id="idleProp" label="#{i18njms['connectionFactory.idleTimeout']}" for="idleTimeout"
                      helpText="#{i18njms['connectionFactory.idleTimeoutHelp']}">
            <h:inputText id="idleTimeout" value="#{pool['idleTimeoutInSeconds']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
            <h:outputText value="#{i18n['common.Seconds']}" style="padding: 8pt"/>
        </adm:property>
        <adm:property id="maxWaitProp" label="#{i18njms['connectionFactory.maxWait']}" for="maxWait"
                      helpText="#{i18njms['connectionFactory.maxWaitHelp']}">
            <h:inputText id="maxWait" value="#{pool['maxWaitTimeInMillis']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
            <h:outputText value="#{i18n['common.Milliseconds']}" style="padding: 8pt"/>
        </adm:property>
        <adm:property id="failProp" label="#{i18njms['connectionFactory.onFail']}" for="failAllConnections"
                      helpText="#{i18njms['connectionFactory.onFailHelp']}">
            <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="failAllConnections" value="#{bean.flags['failAllConnections']}"/></span>
            <h:outputLabel for="failAllConnections" value="#{i18njms['connectionFactory.closeAll']}"/>
        </adm:property>
        <adm:property id="transprop" label="#{i18njms['connectionFactory.transSupport']}" for="transactionSupport"
                      helpText="#{i18njms['connectionFactory.transSupportHelp']}">
            <h:selectOneMenu id="transactionSupport" value="#{pool['transactionSupport']}" styleClass="MnuStd_sun4">
                <f:selectItem itemValue="" itemLabel=""/>
                <f:selectItem itemValue="XATransaction" itemLabel="XATransaction"/>
                <f:selectItem itemValue="LocalTransaction" itemLabel="LocalTransaction"/>
                <f:selectItem itemValue="NoTransaction" itemLabel="NoTransaction"/>
            </h:selectOneMenu>
        </adm:property>
        <adm:property id="conValidationProp" label="#{i18njms['connectionFactory.conValidation']}" for="connectionValidation"
                      helpText="#{i18njms['connectionFactory.conValidationHelp']}">
            <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="connectionValidation" value="#{bean.flags['isConnectionValidationRequired']}"/></span>
            <h:outputLabel for="connectionValidation" value="#{i18n['common.Required']}"/>
        </adm:property>
    </adm:propertySheet>
</ui:composition>

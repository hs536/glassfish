<!--
    Prototype (adr/0006, adr/0008, adr/0009): the JMS connection factories list as a Facelets page. It takes precedence
    over jmsConnections.jsf and renders only the page content.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njms" value="#{consoleBundles.get('jms', 'org.glassfish.jms.admingui.Strings')}"/>
    <c:set var="bean" value="#{jmsConnectionFactoriesView}"/>

    <h:form id="propertyForm">
        <adm:pageTitle id="propertyContentPage" title="#{i18njms['connectionFactories.pageTitle']}"
                       helpText="#{i18njms['connectionFactories.pageTitleHelp']}"/>
        <br/><br/>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <adm:table id="resourcesTable" title="#{i18njms['resourcesTable.connectionFactories']}" count="#{bean.rows.size()}" columns="6">
            <f:facet name="actions">
                <adm:resourceTableActions id="actions" bean="#{bean}" newPage="/jms/jmsConnectionNew.jsf"
                                          deleteConfirmation="#{i18njms['resourcesTable.deleteConnMessage']}"/>
            </f:facet>
            <f:facet name="header">
                <h:panelGroup>
                    <adm:sortHeader text="#{i18n['common.SelectHeader']}" width="3%"/>
                    <adm:sortHeader id="nameHeader" text="#{i18njms['resourcesTable.colJndiName']}" key="name" sorter="#{bean}"/>
                    <adm:sortHeader id="logicalNameHeader" text="#{i18n['common.resourcesTable.colLogicalJndiName']}" key="logicalJndiName" sorter="#{bean}"/>
                    <adm:sortHeader id="statusHeader" text="#{bean.onlyServer ? i18n['deployTable.colEnabled'] : i18n['deployTable.colStatus']}" key="status" sorter="#{bean}"/>
                    <adm:sortHeader id="typeHeader" text="#{i18njms['resourcesTable.colResType']}" key="resType" sorter="#{bean}"/>
                    <adm:sortHeader id="descHeader" text="#{i18njms['resourcesTable.colDesc']}" key="description" sorter="#{bean}"/>
                </h:panelGroup>
            </f:facet>
            <ui:repeat id="rows" value="#{bean.rows}" var="row">
                <tr>
                    <td class="TblTdSel_sun4" align="left">
                        <span class="CbSpn_sun4">
                            <h:selectBooleanCheckbox id="select" value="#{row.selected}" title="#{i18n['common.select']}">
                                <f:ajax render=":propertyForm:resourcesTable:actions"/>
                            </h:selectBooleanCheckbox>
                        </span>
                    </td>
                    <th class="TblTdLyt_sun4" align="left" scope="row">
                        <h:outputLink id="link" value="#{request.contextPath}/jms/jmsConnectionEdit.jsf">
                            <f:param name="name" value="#{row.name}"/>
                            #{row.name}
                        </h:outputLink>
                    </th>
                    <td class="TblTdLyt_sun4" align="left">#{row.logicalJndiName}</td>
                    <td class="TblTdLyt_sun4" align="left">
                        <h:outputLink id="targetLink" rendered="#{not bean.onlyServer}"
                                      value="#{request.contextPath}/common/resourceNode/resourceEditTargets.jsf">
                            <f:param name="name" value="#{row.name}"/>
                            <f:param name="generalPage" value="/jms/jmsConnectionEdit.jsf?name=#{row.name}"/>
                            #{bean.status(row)}
                        </h:outputLink>
                        <h:graphicImage id="enabledImage" rendered="#{bean.onlyServer}"
                                        value="/resource/images/#{bean.enabledOnServer(row) ? 'enabled.png' : 'disabled.png'}"/>
                    </td>
                    <td class="TblTdLyt_sun4" align="left">#{row.attributes['resType']}</td>
                    <td class="TblTdLyt_sun4" align="left">#{row.attributes['description']}</td>
                </tr>
            </ui:repeat>
        </adm:table>
    </h:form>
    <script>document.title = '#{i18njms['connectionFactories.pageTitle']}';</script>
</ui:composition>

<!--
    Prototype (adr/0006, adr/0008, adr/0009): the Jakarta Mail sessions list as a Facelets page. It takes precedence
    over jakartaMailResources.jsf and renders only the page content.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18nfull" value="#{consoleBundles.get('full', 'org.glassfish.full.admingui.Strings')}"/>
    <c:set var="i18njmail" value="#{consoleBundles.get('jmail', 'org.glassfish.jmail.admingui.Strings')}"/>
    <c:set var="themeImages" value="#{request.contextPath}/theme/com/sun/webui/jsf/suntheme/images"/>
    <c:set var="bean" value="#{mailResourcesView}"/>

    <h:form id="propertyForm">
        <adm:pageTitle id="propertyContentPage" title="#{i18njmail['javaMailSessions.pageTitle']}"
                       helpText="#{i18njmail['javaMailSessions.pageTitleHelp']}"/>
        <br/><br/>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <adm:table id="resourcesTable" title="#{i18njmail['resourcesTable.sessions']}" count="#{bean.rows.size()}" columns="4">
            <f:facet name="actions">
                <h:panelGroup id="actions">
                    <h:commandLink id="selectAll" title="#{i18n['table.selectAll']}" action="#{bean.selectAll}">
                        <f:ajax execute="@form" render="@form"/>
                        <img src="#{themeImages}/table/select_multiple.gif" alt="#{i18n['table.selectAll']}" height="20" width="23" border="0" align="top"/>
                    </h:commandLink>
                    <h:commandLink id="deselectAll" title="#{i18n['table.deselectAll']}" action="#{bean.deselectAll}">
                        <f:ajax execute="@form" render="@form"/>
                        <img src="#{themeImages}/table/deselect_multiple.gif" alt="#{i18n['table.deselectAll']}" height="20" width="23" border="0" align="top"/>
                    </h:commandLink>
                    <input id="propertyForm:newButton" type="button" class="Btn1_sun4" value="#{i18n['button.New']}"
                           onclick="admingui.ajax.loadPage({url: '#{request.contextPath}/jmail/mailResourceNew.jsf'}); return false;"/>
                    <h:commandButton id="deleteButton" value="#{i18n['button.Delete']}"
                                     styleClass="#{bean.anySelected ? 'Btn2_sun4' : 'Btn2Dis_sun4'}" disabled="#{not bean.anySelected}"
                                     pt:data-confirm="#{i18nfull['msg.JS.confirmDeleteCR']}"
                                     onclick="if (!confirm(this.dataset.confirm)) { return false; }" action="#{bean.delete}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <h:commandButton id="enableButton" value="#{i18n['button.Enable']}"
                                     styleClass="#{bean.anySelected ? 'Btn2_sun4' : 'Btn2Dis_sun4'}" disabled="#{not bean.anySelected}"
                                     action="#{bean.enable}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <h:commandButton id="disableButton" value="#{i18n['button.Disable']}"
                                     styleClass="#{bean.anySelected ? 'Btn2_sun4' : 'Btn2Dis_sun4'}" disabled="#{not bean.anySelected}"
                                     action="#{bean.disable}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                </h:panelGroup>
            </f:facet>
            <f:facet name="header">
                <h:panelGroup>
                    <adm:sortHeader text="#{i18n['common.SelectHeader']}" width="3%"/>
                    <adm:sortHeader id="nameHeader" text="#{i18njmail['resourcesTable.colJndiName']}" key="name" sorter="#{bean}"/>
                    <adm:sortHeader id="statusHeader" text="#{bean.onlyServer ? i18n['deployTable.colEnabled'] : i18n['deployTable.colStatus']}" key="status" sorter="#{bean}"/>
                    <adm:sortHeader text="#{i18njmail['resourcesTable.colDesc']}"/>
                </h:panelGroup>
            </f:facet>
            <ui:repeat id="rows" value="#{bean.rows}" var="row">
                <tr>
                    <td class="TblTdSel_sun4" align="left">
                        <span class="CbSpn_sun4">
                            <h:selectBooleanCheckbox id="select" value="#{row.selected}" title="#{i18n['common.select']}">
                                <f:ajax render=":propertyForm:resourcesTable:actions"/>
                            </h:selectBooleanCheckbox>
                        </span>
                    </td>
                    <th class="TblTdLyt_sun4" align="left" scope="row">
                        <h:outputLink id="link" value="#{request.contextPath}/jmail/mailResourceEdit.jsf">
                            <f:param name="name" value="#{row.name}"/>
                            #{row.name}
                        </h:outputLink>
                    </th>
                    <td class="TblTdLyt_sun4" align="left">
                        <h:outputLink id="targetLink" rendered="#{not bean.onlyServer}"
                                      value="#{request.contextPath}/common/resourceNode/resourceEditTargets.jsf">
                            <f:param name="name" value="#{row.name}"/>
                            <f:param name="generalPage" value="/jmail/mailResourceEdit.jsf?name=#{row.name}"/>
                            #{bean.status(row)}
                        </h:outputLink>
                        <h:graphicImage id="enabledImage" rendered="#{bean.onlyServer}"
                                        value="/resource/images/#{bean.enabledOnServer(row) ? 'enabled.png' : 'disabled.png'}"/>
                    </td>
                    <td class="TblTdLyt_sun4" align="left">#{row.attributes['description']}</td>
                </tr>
            </ui:repeat>
        </adm:table>
    </h:form>
    <script>document.title = '#{i18njmail['javaMailSessions.pageTitle']}';</script>
</ui:composition>

<!--
    Prototype (adr/0006, adr/0008): the new Jakarta Mail session page as a Facelets page. It takes precedence over
    mailResourceNew.jsf. The target section comes from the integration point TargetSectionForResource.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njmail" value="#{consoleBundles.get('jmail', 'org.glassfish.jmail.admingui.Strings')}"/>
    <c:set var="bean" value="#{mailResourceNewView}"/>

    <h:form id="form">
        <adm:pageTitle id="propertyContentPage" title="#{i18njmail['javaMail.newPageTitle']}" helpText="#{i18njmail['javaMail.newPageTitleHelp']}">
            <f:facet name="buttons">
                <h:panelGroup id="topButtons">
                    <h:commandButton id="newButton" value="#{i18n['button.OK']}" styleClass="Btn1_sun4" action="#{bean.create}">
                        <f:ajax execute="@form" render="@form"/>
                    </h:commandButton>
                    <input id="form:cancelButton" type="button" class="Btn2_sun4" value="#{i18n['button.Cancel']}"
                           onclick="admingui.ajax.loadPage({url: '#{request.contextPath}/jmail/jakartaMailResources.jsf'}); return false;"/>
                </h:panelGroup>
            </f:facet>
            <h:commandButton id="sendTestEmail" value="#{i18njmail['button.SendTestEmail']}" styleClass="Btn2_sun4" action="#{bean.sendTestEmail}">
                <f:ajax execute="@form" render="@form"/>
            </h:commandButton>
        </adm:pageTitle>
        <h:messages id="messages" layout="table" infoClass="inlinePageHelp_sun4" errorClass="LblLev2Txt_sun4"/>

        <ui:include src="/jmail/mailResourceAttr.xhtml">
            <ui:param name="bean" value="#{bean}"/>
            <ui:param name="edit" value="#{false}"/>
        </ui:include>

        <adm:propertyTable id="basicTable" rows="#{bean.properties}" title="#{i18n['common.AdditionalProperties']}"/>

        <c:forEach items="#{consoleIntegrationPoints.faceletsViews('org.glassfish.admingui:TargetSectionForResource')}" var="targetView">
            <ui:include src="#{targetView}"/>
        </c:forEach>
            <input id="helpKey" type="hidden" value="#{consoleBundles.get('jmail', 'org.glassfish.jmail.admingui.Helplinks')['javaMailSessionNew']}"/>
    </h:form>
    <script>document.title = '#{i18njmail['javaMail.newPageTitle']}';</script>
</ui:composition>

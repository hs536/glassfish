<!--
    Prototype (adr/0008): the attributes of a Jakarta Mail session, shared by the new and edit pages (the Facelets
    counterpart of mailResourceAttr.inc). Parameters: bean (a ResourceNewView or ResourceEditView of the mail
    session), edit (true on the edit page).
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:c="jakarta.tags.core"
                xmlns:adm="jakarta.faces.composite/admingui">
    <c:set var="i18n" value="#{consoleBundles.get('', 'org.glassfish.admingui.core.Strings')}"/>
    <c:set var="i18njmail" value="#{consoleBundles.get('jmail', 'org.glassfish.jmail.admingui.Strings')}"/>

    <adm:propertySheet id="propertySheet">
        <adm:property id="nameProp" label="#{i18n['common.jndiName']}" rendered="#{edit}">
            <h:outputText id="name" value="#{bean.name}"/>
        </adm:property>
        <adm:property id="nameNewProp" label="#{i18n['common.jndiName']}" for="nameNew" required="true" rendered="#{not edit}">
            <h:inputText id="nameNew" value="#{bean.values['name']}" size="30" maxlength="512" styleClass="required TxtFld_sun4"
                         required="#{not edit}" requiredMessage="#{i18n['msg.JS.enterValue']} #{i18n['common.jndiName']}"
                         validator="#{bean.validateName}"/>
        </adm:property>
        <adm:property id="hostProp" label="#{i18njmail['javaMail.mailHost']}" for="host" required="true" helpText="#{i18njmail['javaMail.mailHostHelp']}">
            <h:inputText id="host" value="#{bean.values['host']}" size="55" maxlength="512" styleClass="required TxtFld_sun4"
                         required="true" requiredMessage="#{i18n['msg.JS.enterValue']} #{i18njmail['javaMail.mailHost']}"/>
        </adm:property>
        <adm:property id="userProp" label="#{i18njmail['javaMail.user']}" for="user" required="true" helpText="#{i18njmail['javaMail.userHelp']}">
            <h:inputText id="user" value="#{bean.values['user']}" size="55" maxlength="512" styleClass="required TxtFld_sun4"
                         required="true" requiredMessage="#{i18n['msg.JS.enterValue']} #{i18njmail['javaMail.user']}"/>
        </adm:property>
        <adm:property id="fromProp" label="#{i18njmail['javaMail.returnAddr']}" for="from" required="true" helpText="#{i18njmail['javaMail.returnAddrHelp']}">
            <h:inputText id="from" value="#{bean.values['from']}" size="55" maxlength="512" styleClass="required TxtFld_sun4"
                         required="true" requiredMessage="#{i18n['msg.JS.enterValue']} #{i18njmail['javaMail.returnAddr']}"/>
        </adm:property>
        <adm:property id="deploymentOrderProp" label="#{i18n['common.resource.deploymentOrder']}" for="deploymentOrder" rendered="#{edit}"
                      helpText="#{i18n['common.resource.deploymentOrderHelp']}">
            <h:inputText id="deploymentOrder" value="#{bean.values['deploymentOrder']}" size="10" maxlength="512" styleClass="integer TxtFld_sun4"/>
        </adm:property>
        <adm:property id="descProp" label="#{i18n['common.description']}" for="desc" helpText="#{i18njmail['javaMail.descHelp']}">
            <h:inputText id="desc" value="#{bean.values['description']}" size="55" maxlength="512" styleClass="TxtFld_sun4"/>
        </adm:property>
        <adm:property id="statusProp" label="#{i18n['common.status']}" for="enabled" rendered="#{not edit or bean.onlyServer}">
            <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="enabled" value="#{bean.enabled}"/></span>
        </adm:property>
        <adm:property id="statusProp2" label="#{i18n['common.status']}" rendered="#{edit and not bean.onlyServer}"
                      helpText="#{i18n['application.EnableTargetHelp']}">
            <h:outputText id="enabledStr" value="#{bean.status}"/>
        </adm:property>
    </adm:propertySheet>

    <adm:propertySheet id="section2" legend="#{i18n['common.Advanced']}">
        <adm:property id="storeProp" label="#{i18njmail['javaMail.storeProtocol']}" for="storeP" helpText="#{i18njmail['javaMail.storeProtocolHelp']}">
            <h:inputText id="storeP" value="#{bean.values['storeProtocol']}" size="55" maxlength="512" styleClass="TxtFld_sun4"/>
        </adm:property>
        <adm:property id="storeClassProp" label="#{i18njmail['javaMail.storeClass']}" for="storeClass" helpText="#{i18njmail['javaMail.storeClassHelp']}">
            <h:inputText id="storeClass" value="#{bean.values['storeProtocolClass']}" size="55" maxlength="512" styleClass="TxtFld_sun4"/>
        </adm:property>
        <adm:property id="transPProp" label="#{i18njmail['javaMail.transportProtocol']}" for="transP" helpText="#{i18njmail['javaMail.transportProtocolHelp']}">
            <h:inputText id="transP" value="#{bean.values['transportProtocol']}" size="55" maxlength="512" styleClass="TxtFld_sun4"/>
        </adm:property>
        <adm:property id="transClassProp" label="#{i18njmail['javaMail.transProtocolClass']}" for="transPClass" helpText="#{i18njmail['javaMail.transProtocolClassHelp']}">
            <h:inputText id="transPClass" value="#{bean.values['transportProtocolClass']}" size="55" maxlength="512" styleClass="TxtFld_sun4"/>
        </adm:property>
        <adm:property id="debugProp" label="#{i18njmail['javaMail.Debug']}" for="debug" helpText="#{i18njmail['javaMail.DebugHelp']}">
            <span class="CbSpn_sun4"><h:selectBooleanCheckbox id="debug" value="#{bean.debug}"/></span>
        </adm:property>
    </adm:propertySheet>
</ui:composition>
